<style>
:root{

  --accent:#17493a; --accent-text:#ffffff; --accent-soft:#e2eee7;
  --best-bg:#d9f1e0; --best-line:#2a8a55; --best-text:#0f4a2a;
  --warn:#8a5300; --warn-bg:#fbeecf; --cot:#6b4e00; --cot-bg:#f6e7b8;
  --bad:#a8231b; --bad-bg:#fbe3e0; --good:#17693b;
  --side:#14261f; --side-text:#dbe7e1; --side-muted:#8fa79b;
  --radius:6px; --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --surface:#1a211d; --text:#e6ece8; --muted:#9aa8a1; --line:#2f3a34; --line-soft:#252e29;
    --accent:#5fc79f; --accent-text:#0b1511; --accent-soft:#1f2f28;
    --best-bg:#1c3a2a; --best-line:#4fbf83; --best-text:#a5ebc5;
    --warn:#f0c26a; --warn-bg:#3a2d10; --cot:#f0d98a; --cot-bg:#3a3110; --bad:#ff8f86; --bad-bg:#3a1a17; --good:#6fd39b;
    --side:#0c1210; --side-text:#dbe7e1; --side-muted:#7d958a;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
h1{font-size:1.35rem;margin:0}
h2{font-size:1.02rem;margin:0}
h3{font-size:.95rem;margin:0}
p{margin:0 0 .6rem}
.muted{color:var(--muted)}
.n{text-align:right}

/* estrutura */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.lateral{background:var(--side);color:var(--side-text);padding:1rem .7rem;position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:.15rem}
.marca{padding:.2rem .6rem 1rem}
.marca strong{display:block;font-size:1.02rem}
.marca span{font-size:.78rem;color:var(--side-muted)}
.lateral a{display:block;padding:.5rem .7rem;border-radius:var(--radius);color:var(--side-text);text-decoration:none;font-size:.93rem}
.lateral a:hover{background:rgba(255,255,255,.08)}
.lateral a[aria-current="page"]{background:var(--accent);color:var(--accent-text);font-weight:600}
.lateral .grupo-nav{font-size:.72rem;color:var(--side-muted);padding:.9rem .7rem .2rem;letter-spacing:.02em}
.pagina{max-width:1400px;width:100%;padding:1.25rem 1.4rem}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.topo p{margin:.15rem 0 0;font-size:.88rem}
.acoes-topo{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}

/* componentes */
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:1rem}
.painel>header{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;padding:.75rem 1rem;border-bottom:1px solid var(--line)}
.painel .corpo{padding:1rem}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem}
.duas>.painel{margin-bottom:0}
.layout-compra{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:1rem;align-items:start}
.sticky{position:sticky;top:1rem}
button,.btn{font:inherit;padding:.45rem .85rem;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--surface);color:var(--text);cursor:pointer;min-height:38px}
button:hover{border-color:var(--accent)}
button.primario{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
button.perigo{color:var(--bad)}
button.mini{min-height:30px;padding:.15rem .55rem;font-size:.85rem}
button.icone{min-height:30px;width:30px;padding:0;line-height:1}
button[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:.45rem .55rem;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--bg);color:var(--text);min-height:38px}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
input[type=checkbox]{width:auto;min-height:0}
label{display:block;font-weight:600;font-size:.86rem;margin-bottom:.2rem}
.campo{margin-bottom:.8rem}
.erro{color:var(--bad);font-size:.85rem;min-height:1.1em}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.grade3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem}
.filtros{display:flex;flex-wrap:wrap;gap:.7rem 1rem;align-items:end;padding:.75rem 1rem;border-bottom:1px solid var(--line);background:var(--bg)}
.filtros .campo{margin:0;max-width:100%}
.filtros select{max-width:100%}
.filtros select,.filtros input{width:auto;min-width:130px}
.filtros input[type=search]{min-width:200px}
.filtros input[type=checkbox]{min-width:0}
.filtros .marca-chk{display:flex;align-items:center;gap:.4rem;min-height:38px}
.filtros .marca-chk label{margin:0;font-weight:500}
.abas{display:flex;gap:.25rem;flex-wrap:wrap;margin-bottom:1rem;border-bottom:1px solid var(--line)}
.abas button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:.5rem .9rem;min-height:40px;color:var(--muted)}
.abas button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--text);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.75rem;margin-bottom:1rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.75rem 1rem}
.kpi .rot{font-size:.8rem;color:var(--muted)}
.kpi .val{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.8rem;color:var(--muted)}
.resumo{display:flex;flex-wrap:wrap;gap:1.5rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.resumo div{min-width:110px}
.resumo .rot{font-size:.8rem;color:var(--muted)}
.resumo .val{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.bom{color:var(--good)} .ruim{color:var(--bad)}
.tabela{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:.5rem .65rem;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
th{font-size:.82rem;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--surface);position:sticky;top:0}
th button.ord{all:unset;cursor:pointer;font:inherit;color:inherit}
th button.ord:hover{color:var(--text,inherit);text-decoration:underline}
th button.ord:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.grade4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{white-space:nowrap}
td.acao{white-space:nowrap;text-align:right}
td a{color:var(--accent);text-decoration:none;font-weight:600}
td a:hover{text-decoration:underline}
.mes-tab td:first-child,.mes-tab th:first-child{min-width:230px;position:sticky;left:0;background:var(--surface);z-index:1}
.mes-tab tr.grupo td:first-child{background:var(--accent-soft)}
.mes-tab tr.total td:first-child{background:var(--bg)}
.mes-tab tr.clicavel:hover td:first-child{background:var(--accent-soft)}
tr.total td{font-weight:700;background:var(--bg);border-top:2px solid var(--line)}
tr.sub td{color:var(--muted);font-size:.9rem}
tr.grupo td{background:var(--accent-soft);font-weight:600}
tr.clicavel{cursor:pointer}
tr.clicavel:hover td{background:var(--accent-soft)}
td input.cel{min-height:30px;padding:.15rem .4rem;width:92px;text-align:right}
.vazio{padding:1.5rem 1rem;text-align:center;color:var(--muted);margin:0}
.tag{display:inline-block;font-size:.72rem;padding:.05rem .45rem;border-radius:99px;background:var(--line-soft);color:var(--muted);white-space:nowrap}
.tag.cot{background:var(--cot-bg);color:var(--cot)}
.tag.aviso{background:var(--warn-bg);color:var(--warn)}
.linha-ep td:not(.acao){background:var(--warn-bg)}
.tag.ruim{background:var(--bad-bg);color:var(--bad)}
.tag.ok{background:var(--best-bg);color:var(--best-text)}
.un{color:var(--muted);font-size:.85em}
.pag{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.6rem 1rem;flex-wrap:wrap;border-top:1px solid var(--line)}
.alertas{margin:0;padding:.6rem 1rem;background:var(--warn-bg);color:var(--warn);font-size:.88rem;border-bottom:1px solid var(--line)}
.barra{height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden;min-width:70px}
.barra i{display:block;height:100%;background:var(--accent)}

/* produção e compras */
.linha-add{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:end}
.linha-add .prod{grid-column:1 / -1}
.un-tag{font-size:.8rem;color:var(--muted);margin-top:.2rem;min-height:1.1em}
#nec-lista{list-style:none;margin:.9rem 0 0;padding:0}
#nec-lista li{display:grid;grid-template-columns:1fr 92px 34px 30px;gap:.5rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line-soft)}
#nec-lista .nome{min-width:0}
#nec-lista .nome strong{display:block;font-weight:600;overflow-wrap:anywhere}
#nec-lista .nome span{font-size:.8rem;color:var(--muted)}
.item-nome{display:flex;gap:.4rem;align-items:flex-start}
.item-nome .txt{min-width:0}
.item-nome small{display:block;color:var(--muted);font-size:.78rem}
.exp{min-height:26px;width:26px;padding:0;border:0;background:none;font-size:.9rem;color:var(--muted)}
.exp[aria-expanded="true"]{transform:rotate(90deg)}
td.melhor{background:var(--best-bg);box-shadow:inset 3px 0 0 var(--best-line);color:var(--best-text)}
td.melhor strong{color:inherit}
td.sem{background:var(--warn-bg);color:var(--warn)}
tr.detalhe>td{background:var(--bg);padding:.75rem 1rem 1rem 2.4rem;max-width:0}
.det-wrap{overflow-x:auto}
.det-tab th,.det-tab td{padding:.35rem .5rem;font-size:.88rem}
.det-tab .tag{white-space:normal}
.det-tab td:nth-child(3){min-width:230px}
.det-tab tr.melhor td{background:var(--best-bg);color:var(--best-text);font-weight:600}
.det-tab input{min-height:32px;width:100px;padding:.2rem .4rem}
.det-add{display:flex;flex-wrap:wrap;gap:.5rem;align-items:end;margin-top:.7rem}
.det-add select{width:auto;min-width:200px;min-height:32px}
.det-add input{width:110px;min-height:32px}
.grupo-forn{border-top:1px solid var(--line);overflow-x:auto}
.grupo-forn:first-child{border-top:0}
.grupo-forn h3{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 1rem .3rem}
.grupo-forn td,.grupo-forn th{padding:.3rem 1rem}
.so-impressao{display:none}

dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:1.25rem;width:min(600px,94vw);max-height:92vh}
dialog.largo{width:min(920px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin-bottom:.8rem;font-size:1.1rem}
.rodape-dlg{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
#avisos{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:30}
.aviso{background:var(--text);color:var(--bg);padding:.6rem .9rem;border-radius:var(--radius);max-width:340px}
.aviso.erro{background:var(--bad);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lateral{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:.5rem;gap:.2rem}
  .lateral .marca{width:100%;padding:.2rem .5rem}
  .lateral .grupo-nav{display:none}
  .layout-compra{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .pagina{padding:.75rem}
  .grade3{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  .lateral,.topo,.filtros,.pag,button,#avisos{display:none!important}
  .app{display:block}
  .pagina{padding:0;max-width:none}
  .painel{border:0}
  body.imprimindo #tela > *{display:none!important}
  body.imprimindo #tela > .alvo-impressao{display:block!important}
  body.imprimindo .alvo-impressao .barra-lista{display:none!important}
  body.imprimindo .alvo-impressao .so-impressao{display:block;margin:0 0 .5rem}
  .grupo-forn{break-inside:avoid}
  tr{break-inside:avoid}
  @page{margin:14mm}
  @page pedido-58mm{margin:0}   /* sem "size": o tamanho do papel vem da impressora (driver), como no Excel */
  @page pedido-a4{size:A4;margin:16mm}
  body.imprimindo dialog{display:none!important}
  #pedido-imp{margin:0!important}
  body.imprimindo-cupom{background:#fff;margin:0;padding:0}
  body.imprimindo-cupom>*:not(#cupom-58){display:none!important}
  body.imprimindo-cupom #cupom-58{display:block!important;page:pedido-58mm}
  #pedido-imp.fmt-a4{page:pedido-a4;font-size:13px}
}
#cupom-58{display:none;width:58mm;box-sizing:border-box;padding:3mm 5mm;font-size:10px;line-height:1.3;color:#000;overflow-wrap:anywhere}
#cupom-58 div[style*="display:flex"]>span:first-child{min-width:0}
#cupom-58 div[style*="display:flex"]>span:last-child{white-space:nowrap}
input.dinheiro{text-align:right}
.term{display:grid;grid-template-columns:130px minmax(0,1fr);gap:1.4rem;padding:1rem;align-items:center}
.term-val{font-size:2.4rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.caixa-dvv{border:1px solid var(--line);border-radius:var(--radius);padding:.7rem 1rem;margin:.6rem 0;background:var(--surface)}
.caixa-dvv input{max-width:7rem}
.seg{display:flex;flex-wrap:wrap;gap:.3rem}
.seg button{min-height:32px;padding:.15rem .7rem;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.gr-col{cursor:pointer;outline:none}.gr-col:hover>rect:first-of-type{fill:var(--accent-soft)}.gr-col:focus-visible>rect:first-of-type{stroke:var(--accent);stroke-width:2}
.acoes-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:.8rem}
.acao{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--radius);padding:.75rem 1rem;background:var(--surface)}
.acao.p1{border-left-color:var(--bad)}.acao.p2{border-left-color:var(--warn)}.acao.p3{border-left-color:var(--best-line)}
.acao h3{margin:.4rem 0 .3rem}.acao p{margin:0 0 .4rem;font-size:.9rem}.acao .impacto{font-size:.92rem}
.acao details{margin:.3rem 0 .5rem}.acao summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
.acao>a{color:var(--accent);font-weight:600;text-decoration:none;font-size:.9rem}
@media (max-width:560px){.term{grid-template-columns:1fr;justify-items:center}}

</style>

const diasEntre = (a, b) => Math.round((utc(b) - utc(a)) / 86400000);

  const [y, m, d] = iso.split("-").map(Number);

function sanitizarDinheiro(el) {
  let v = el.value.replace(/[^\d.,]/g, "").replace(/\./g, ",");
  const i = v.indexOf(",");
  if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/,/g, "").slice(0, 2);

function formatarTel(d) {
  d = soDigitos(d).slice(0, 11);
  if (!d) return "";
  if (d.length <= 2) return "(" + d;
  if (d.length <= 6) return "(" + d.slice(0, 2) + ") " + d.slice(2);
  if (d.length <= 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);

/* cadastro de clientes construído a partir dos nomes que já existem nas vendas */
function clientesDeVendas(vendas) {
  const m = new Map();

    const n = normNome(v.cli); if (!n || n === "PERDA") return;
    const c = m.get(n) || { nome: n, tel: "", end: "" };

  if (d.cfg.motoNome === undefined) d.cfg.motoNome = "";
  d.entregas.forEach(e => { if (e.vm === undefined) e.vm = e.mpV !== undefined ? e.mpV : d.cfg.motoEntrega; });

  if (!d.motoV) {
    const sem = x => !x.mid;
    if (d.motoTurnos.some(sem) || d.motoPagtos.some(sem) || d.entregas.some(sem)) {
      const mid = d.motos.reduce((m, x) => Math.max(m, x.id), 0) + 1;
      d.motos.push({ id: mid, nome: d.cfg.motoNome || "Motoboy", tel: "", veic: "", vh: d.cfg.motoHora || 0, ve: d.cfg.motoEntrega || 0, vc: d.cfg.taxaPadrao || 0, ativo: true });
      [d.motoTurnos, d.motoPagtos, d.entregas].forEach(L => L.forEach(x => { if (sem(x)) x.mid = mid; }));
    }
    d.motoV = 3;
  } else if (d.motoV < 3) {
    /* veio da versão com cadastro de veículos: o veículo agora é só "moto própria" ou "carro da empresa" no dia */
    const V = Array.isArray(d.veics) ? d.veics : [], vp = id => V.find(x => x.id === id);
    d.motos.forEach(m => { const v = vp(m.vid); if (m.ve === undefined) m.ve = v ? v.vEmp : (d.cfg.motoEntrega || 0); if (m.vc === undefined) m.vc = v && v.vCli > 0 ? v.vCli : (d.cfg.taxaPadrao || 0); if (m.veic === undefined) m.veic = v && !v.emp ? v.nome : ""; delete m.vid; });
    d.motoTurnos.forEach(t => { const v = vp(t.vid); if (v && v.emp) t.car = true; delete t.vid; });
    d.entregas.forEach(e => { delete e.vid; if (e.sr) e.vm = 0; });
    const c = V.find(x => x.emp && x.kml > 0); if (c && !(d.cfg.carroKml > 0)) { d.cfg.carroKml = c.kml; d.cfg.carroComb = c.comb; }
    delete d.veics; d.motoV = 3;
  }
  combosGarantir(d);
  return d;
}

/* ===== Índices e cálculos (recalculados quando os dados mudam) ===== */
let _idx = null;
const mediana = v => { const a = v.slice().sort((x, y) => x - y), m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };

function idx() {
  if (_idx) return _idx;
  const ins = new Map(DB.insumos.map(i => [i.c, i]));
  const rec = new Map(Object.entries(DB.receitas));
  const hist = new Map();
  DB.compras.forEach(([d, f, c, q, p]) => {
    if (!hist.has(c)) hist.set(c, []);
    hist.get(c).push({ d, f, q, p });
  });
  hist.forEach(a => {
    a.sort((x, y) => (x.d < y.d ? -1 : x.d > y.d ? 1 : 0));
    /* preço muito fora do padrão do próprio item costuma ser erro de digitação */
    if (a.length >= 4) {
      const med = mediana(a.map(x => x.p));
      a.forEach(x => { x.out = x.p < med * 0.4 ? "baixo" : x.p > med * 2.5 ? "alto" : null; });
    }
  });
  const forn = new Set(DB.fornecedores.map(f => f.n));
  DB.compras.forEach(c => forn.add(c[1]));
  _idx = { ins, rec, hist, forn: [...forn], memoUn: new Map(), avisos: new Set(), custoIns: new Map(), custoRec: new Map(), estProd: null };
  return _idx;
}

/* custo do insumo = último preço pago (regra da planilha: 1ª linha da última data) */
function custoInsumo(c) {
  const X = idx();
  if (X.custoIns.has(c)) return X.custoIns.get(c);
  const h = X.hist.get(c) || [];
  let p = 0;
  if (h.length) {
    let lista = h;
    if (DB.cfg.custoModo === "confiavel") { const v = h.filter(x => !x.out); if (v.length) lista = v; }
    const ult = lista[lista.length - 1].d;
    p = lista.find(x => x.d === ult).p;
  }
  X.custoIns.set(c, p);
  return p;
}
/* custo por 1 unidade de um produto ou componente (abre as receitas) */
function custoUn(code, pilha) {
  const X = idx(), r = X.rec.get(code);
  if (!r) return custoInsumo(code);
  if (X.custoRec.has(code)) return X.custoRec.get(code);
  pilha = pilha || new Set();
  if (pilha.has(code)) return 0;
  pilha.add(code);
  let t = 0;
  for (const [mp, qmp, qsku] of r.i) t += (qsku ? qmp / qsku : 0) * custoUn(mp, pilha);
  pilha.delete(code);
  X.custoRec.set(code, t);
  return t;
}
const nomeDe = c => { const X = idx(); return (X.ins.get(c) || X.rec.get(c) || DB.produtos[c] || { n: c }).n; };
const unDe = c => { const X = idx(); return (X.ins.get(c) || X.rec.get(c) || DB.produtos[c] || { u: "" }).u || ""; };

/* precificação de um produto (mesma regra da planilha: sugerido = custo / (1 − DVV − EBITDA desejado)) */
function precoInfo(c) {
  const p = DB.produtos[c];
  const f = DB.familias[p.g] || DB.familias.OUTROS || { dvv: 0, ebitda: 0 };
  const custo = DB.receitas[c] ? custoUn(c) : 0;
  const mk = 1 - f.dvv - f.ebitda;
  const real = p.r || 0;
  const eb = real ? real - custo - real * f.dvv : null;
  return { custo, sug: mk > 0 ? custo / mk : null, real, desc: p.d || 0, eb, pe: real ? eb / real : null, dvv: f.dvv, ebitda: f.ebitda };
}

/* estoque de produtos acabados = entradas (produção) − vendas */
function estProd() {

  DB.entprod.forEach(([, c, q]) => { g(c).ent += q; });

/* ===== Compras: explosão de receitas e comparação de preços ===== */
/*CALC-INICIO*/
const Calc = (() => {
  const inteiro = u => u === "UN" || u === "PC";

  function porUnidade(ctx, code, pilha) {
    if (ctx.memoUn.has(code)) return ctx.memoUn.get(code);
    const out = new Map();
    const r = ctx.rec.get(code);
    if (!r) { out.set(code, 1); return out; }
    pilha.add(code);
    for (const [mp, qmp, qsku] of r.i) {
      const f = qsku ? qmp / qsku : 0;
      if (ctx.rec.has(mp)) {
        if (pilha.has(mp)) { ctx.avisos.add("Receita circular entre " + code + " e " + mp + "."); continue; }
        porUnidade(ctx, mp, pilha).forEach((v, k) => out.set(k, (out.get(k) || 0) + v * f));
      } else out.set(mp, (out.get(mp) || 0) + f);
    }
    pilha.delete(code);
    ctx.memoUn.set(code, out);
    return out;
  }
  function explodir(ctx, necessidades) {
    ctx.avisos = new Set();
    const total = new Map();
    for (const n of necessidades) {
      const q = Number(n.qtd) || 0;
      if (q <= 0) continue;
      porUnidade(ctx, n.cod, new Set()).forEach((v, k) => total.set(k, (total.get(k) || 0) + v * q));
    }
    return total;
  }
  function isoMenos(iso, dias) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d - dias)).toISOString().slice(0, 10);
  }
  /* o: { hoje, janela (dias, 0 = tudo), cotacoes: { fornecedor: {p, d} } } */
  function precos(ctx, cod, o) {
    const h = ctx.hist.get(cod) || [];
    const corte = o.janela ? isoMenos(o.hoje, o.janela) : "0000-00-00";
    const porF = new Map();
    h.forEach(x => { if (!porF.has(x.f)) porF.set(x.f, []); porF.get(x.f).push(x); });
    const cot = o.cotacoes || {};
    const cands = [];
    porF.forEach((arr, f) => {
      const validas = arr.filter(x => !x.out);
      const ult = validas.length ? validas[validas.length - 1] : arr[arr.length - 1];
      const ultima = arr[arr.length - 1];
      const jan = validas.filter(x => x.d >= corte);
      const media = jan.length ? jan.reduce((s, x) => s + x.p, 0) / jan.length : null;
      const ignorada = ultima !== ult ? ultima : null;
      if (cot[f]) cands.push({ f, p: cot[f].p, d: cot[f].d, src: "cotacao", n: jan.length, media, ignorada });
      else cands.push({ f, p: ult.p, d: ult.d, src: "compra", n: jan.length, media, ignorada,
        foraJanela: ult.d < corte, baixo: ult.out === "baixo", alto: ult.out === "alto" });
    });
    Object.keys(cot).forEach(f => {
      if (!porF.has(f)) cands.push({ f, p: cot[f].p, d: cot[f].d, src: "cotacao", n: 0, media: null });
    });
    const ok = cands.filter(c => !c.baixo && !c.alto);
    const recentes = ok.filter(c => c.src === "cotacao" || !c.foraJanela);
    const pool = recentes.length ? recentes : (ok.length ? ok : cands);
    const ordem = (a, b) => a.p - b.p || (a.d < b.d ? 1 : a.d > b.d ? -1 : 0) || b.n - a.n;
    const melhor = pool.length ? pool.slice().sort(ordem)[0] : null;
    if (melhor) melhor.antigo = pool !== recentes;
    cands.sort(ordem);
    const validasAll = h.filter(x => !x.out);
    const ultimo = validasAll.length ? validasAll[validasAll.length - 1] : (h.length ? h[h.length - 1] : null);
    return { cands, melhor, ultimo, historico: h.length };
  }
  /* o: { hoje, janela, descontarEstoque, estoque: {cod: saldo}, cotacoes: { codigo: { fornecedor: {p, d} } } } */
  function plano(ctx, itens, o) {
    const linhas = [];
    itens.forEach((q, cod) => {
      const i = ctx.ins.get(cod) || { c: cod, n: "Código " + cod + " (sem cadastro)", u: "" };
      const e = o.estoque ? o.estoque[cod] : null;
      const est = e != null ? Math.max(e, 0) : 0;
      let comprar = o.descontarEstoque ? Math.max(q - est, 0) : q;
      if (inteiro(i.u)) comprar = Math.ceil(comprar - 1e-9);
      const pr = precos(ctx, cod, { hoje: o.hoje, janela: o.janela, cotacoes: (o.cotacoes || {})[cod] });

        cands: pr.cands, melhor: m, ultimo: u, historico: pr.historico,
        custo: m ? comprar * m.p : null,
        econ: m && u ? comprar * (u.p - m.p) : null,
        pct: m && u && u.p > 0 ? (m.p - u.p) / u.p : null
      });
    });
    const grupos = new Map();
    linhas.forEach(l => {
      if (l.comprar <= 0) return;
      const k = l.melhor ? l.melhor.f : "SEM PREÇO — COTAR";
      if (!grupos.has(k)) grupos.set(k, { nome: k, itens: [], total: 0 });
      const g = grupos.get(k);
      g.itens.push(l);
      g.total += l.custo || 0;
    });

      const sa = a.nome.startsWith("SEM PREÇO"), sb = b.nome.startsWith("SEM PREÇO");
      return sa - sb || b.total - a.total;
    });
    lista.forEach(g => g.itens.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR")));
    return {
      linhas, grupos: lista,
      custo: linhas.reduce((s, l) => s + (l.custo || 0), 0),
      econ: linhas.reduce((s, l) => s + (l.econ || 0), 0),
      semPreco: linhas.filter(l => l.comprar > 0 && !l.melhor).length
    };
  }
  return { explodir, precos, plano, isoMenos };
})();

function origem(c) {
  if (c.src === "cotacao") return `<span class="tag cot">cotação ${dcurta(c.d)}</span>`;
  return `<span class="tag">pago ${dcurta(c.d)}</span>` + (c.foraJanela ? ' <span class="tag aviso">fora da janela</span>' : "");
}
function ordenarLinhas(linhas) {
  const o = DB.cfg.ordem, a = linhas.slice();
  if (o === "nome") a.sort((x, y) => x.nome.localeCompare(y.nome, "pt-BR"));
  else if (o === "economia") a.sort((x, y) => (y.econ ?? -1e9) - (x.econ ?? -1e9));
  else a.sort((x, y) => (y.custo ?? -1) - (x.custo ?? -1) || x.nome.localeCompare(y.nome, "pt-BR"));
  return a;
}
function detalheHTML(l) {
  const linhas = l.cands.map(c => {
    const vs = l.melhor && c !== l.melhor && l.melhor.p > 0 ? pctd((c.p - l.melhor.p) / l.melhor.p) : (c === l.melhor ? "melhor" : "");
    const q = DB.cot[l.cod] && DB.cot[l.cod][c.f];
    const flags = (c.baixo ? ' <span class="tag aviso">preço muito abaixo do normal, confira</span>' : "") +
      (c.alto ? ' <span class="tag aviso">preço muito acima do normal, confira</span>' : "") +
      (c.ignorada ? ` <span class="tag aviso">compra de ${dcurta(c.ignorada.d)} a ${brl(c.ignorada.p)} ignorada: parece erro</span>` : "");
    return `<tr class="${c === l.melhor ? "melhor" : ""}"><td>${esc(c.f)}</td><td class="n">${brl(c.p)}/${esc(l.un)}</td>
      <td>${origem(c)}${flags}</td><td class="n">${c.media != null ? brl(c.media) + ' <span class="un">(' + c.n + (c.n === 1 ? " compra)" : " compras)") : "—"}</td>
      <td><input type="number" min="0" step="any" inputmode="decimal" placeholder="R$" value="${q ? esc(q.p) : ""}" data-mud="cotacao" data-cod="${esc(l.cod)}" data-forn="${esc(c.f)}" aria-label="Cotação de hoje de ${esc(c.f)}"></td>
      <td class="n">${vs}</td></tr>`;
  }).join("");
  const opts = fornecedoresNomes().map(f => `<option>${esc(f)}</option>`).join("");
  return `<div class="det-wrap"><table class="det-tab"><thead><tr><th>Fornecedor</th><th class="n">Preço</th><th>Origem</th><th class="n">Média na janela</th><th>Cotação de hoje</th><th class="n">Contra o melhor</th></tr></thead>
    <tbody>${linhas || '<tr><td colspan="6" class="muted">Nenhuma compra registrada para este item. Informe uma cotação abaixo.</td></tr>'}</tbody></table></div>
    <div class="det-add"><div><label for="cq-f-${esc(l.cod)}">Cotar com outro fornecedor</label><select id="cq-f-${esc(l.cod)}">${opts}</select></div>
      <div><label for="cq-p-${esc(l.cod)}">Preço por ${esc(l.un)}</label><input id="cq-p-${esc(l.cod)}" type="number" min="0" step="any" inputmode="decimal"></div>
      <button type="button" class="mini" data-acao="cotar" data-cod="${esc(l.cod)}">Salvar cotação</button>
      <button type="button" class="mini" data-acao="dlg-compra" data-cod="${esc(l.cod)}">Registrar compra</button></div>`;
}
function linhaCompraHTML(l) {
  const ab = abertos.has(l.cod), m = l.melhor;
  const melhorTd = m
    ? `<td class="melhor"><strong>${esc(m.f)}</strong><br>${brl(m.p)}<span class="un">/${esc(l.un)}</span> ${origem(m)}${l.historico < 3 && m.src !== "cotacao" ? ' <span class="tag aviso">poucos dados</span>' : ""}</td>`
    : `<td class="sem"><strong>Sem histórico de compra</strong><br>Informe uma cotação</td>`;
  const u = l.ultimo;
  const ultTd = u ? `<td>${brl(u.p)}<span class="un">/${esc(l.un)}</span><br><span class="muted">${esc(u.f)} · ${dcurta(u.d)}</span></td>` : "<td>—</td>";
  let difTd = "<td>—</td>";
  if (l.pct != null) {
    const cls = l.pct < -0.0005 ? "bom" : l.pct > 0.0005 ? "ruim" : "";
    difTd = `<td class="${cls}"><strong>${Math.abs(l.pct) < 0.0005 ? "igual" : pctd(l.pct)}</strong>` +
      (Math.abs(l.econ) >= 0.005 ? `<br><span class="un">${l.econ > 0 ? "economia " : "a mais "}${brl(Math.abs(l.econ))}</span>` : "") + "</td>";
  }
  const dif = Math.abs(l.comprar - l.precisa) > 1e-9;
  const precisa = `<td class="n">${nq(l.precisa)} <span class="un">${esc(l.un)}</span>` +
    (dif ? `<br><span class="un">comprar ${nq(l.comprar)}</span>` : "") +
    (DB.cfg.descontar && l.estoque != null && l.estoque > 0 ? `<br><span class="un">estoque ${nq(l.estoque)}</span>` : "") + "</td>";
  return `<tr><td><div class="item-nome"><button type="button" class="exp" data-acao="abrir" data-cod="${esc(l.cod)}" aria-expanded="${ab}" aria-label="Comparar fornecedores de ${esc(l.nome)}">▸</button>
      <div class="txt"><strong>${esc(l.nome)}</strong><small>${esc(l.cod)}</small></div></div></td>${precisa}${melhorTd}${ultTd}${difTd}
      <td class="n">${l.custo != null ? brl(l.custo) : "—"}</td></tr>` + (ab ? `<tr class="detalhe"><td colspan="6">${detalheHTML(l)}</td></tr>` : "");
}
function necHTML() {
  if (!DB.nec.length) return '<li class="vazio" style="display:block;border:0">Nenhum produto ainda. Escolha o que será produzido e a quantidade.</li>';
  return DB.nec.map((n, i) => {
    const r = DB.receitas[n.cod];
    return `<li><div class="nome"><strong>${esc(r ? r.n : n.cod)}</strong><span>${esc(n.cod)}</span></div>
      <input type="number" min="0" step="any" inputmode="decimal" value="${esc(n.qtd)}" data-ent="nec-qtd" data-idx="${i}" aria-label="Quantidade de ${esc(r ? r.n : n.cod)}">
      <span class="un">${esc(r ? r.u : "")}</span>
      <button type="button" class="icone" data-acao="remover" data-idx="${i}" aria-label="Remover ${esc(r ? r.n : n.cod)}">×</button></li>`;
  }).join("");
}
function resultadoHTML() {
  if (!DB.nec.length) { PL = null; return '<p class="vazio">Adicione produtos à necessidade de produção. O material necessário e a melhor compra de cada item aparecem aqui.</p>'; }
  const pl = calcular(), econ = pl.econ, avisos = [...idx().avisos];
  return (avisos.length ? `<p class="alertas">${avisos.map(esc).join(" ")}</p>` : "") +
    `<div class="resumo">
      <div><div class="rot">Custo estimado</div><div class="val">${brl(pl.custo)}</div></div>
      <div><div class="rot">${econ >= 0 ? "Economia contra o último pago" : "Acima do último pago"}</div><div class="val ${econ >= 0 ? "bom" : "ruim"}">${brl(Math.abs(econ))}</div></div>
      <div><div class="rot">Itens</div><div class="val">${pl.linhas.length}</div></div>
      ${pl.semPreco ? `<div><div class="rot">Sem preço</div><div class="val ruim">${pl.semPreco}</div></div>` : ""}
    </div>
    <div class="filtros">
      <div class="campo"><label for="f-janela">Janela de preços</label><select id="f-janela" data-mud="cfg" data-cfg="janela">
        ${opcoes([[30, "Últimos 30 dias"], [60, "Últimos 60 dias"], [90, "Últimos 90 dias"], [180, "Últimos 6 meses"], [365, "Último ano"], [0, "Todo o histórico"]], DB.cfg.janela)}</select></div>
      <div class="campo"><label for="f-ordem">Ordenar por</label><select id="f-ordem" data-mud="cfg" data-cfg="ordem">
        ${opcoes([["custo", "Maior custo"], ["economia", "Maior economia"], ["nome", "Nome"]], DB.cfg.ordem)}</select></div>
      <div class="marca-chk"><input type="checkbox" id="f-estoque" data-mud="cfg" data-cfg="descontar" ${DB.cfg.descontar ? "checked" : ""}><label for="f-estoque">Descontar o estoque de matéria-prima</label></div>
    </div>
    <div class="tabela"><table>
      <thead><tr><th>Matéria-prima</th><th class="n">Precisa</th><th>Melhor compra</th><th>Último preço pago</th><th>Contra o último</th><th class="n">Custo estimado</th></tr></thead>
      <tbody>${ordenarLinhas(pl.linhas).map(linhaCompraHTML).join("")}</tbody></table></div>`;
}
function listaFornecedorHTML() {
  if (!PL || !PL.grupos.length) return '<p class="vazio">A lista de compra aparece aqui depois que houver material necessário.</p>';
  return PL.grupos.map(g => `<div class="grupo-forn"><h3><span>${esc(g.nome)}</span><span>${g.nome.startsWith("SEM PREÇO") ? "" : brl(g.total)}</span></h3>
    <table><thead><tr><th>Item</th><th class="n">Quantidade</th><th class="n">Preço</th><th class="n">Subtotal</th></tr></thead><tbody>
    ${g.itens.map(l => `<tr><td>${esc(l.nome)}</td><td class="n">${nq(l.comprar)} ${esc(l.un)}</td><td class="n">${l.melhor ? brl(l.melhor.p) : "—"}</td><td class="n">${l.custo != null ? brl(l.custo) : "—"}</td></tr>`).join("")}
    </tbody></table></div>`).join("");
}
function ordemHTML() {
  return `<div class="so-impressao"><h2>Ordem de produção — ${dlonga(hojeISO())}</h2></div>` +
    tabela([{ t: "Código", v: n => n.cod }, { t: "Produto", v: n => nomeDe(n.cod) }, { t: "Quantidade", n: true, v: n => nq(n.qtd) + " " + unDe(n.cod) }], DB.nec.filter(n => Number(n.qtd) > 0));
}
function textoLista() {
  if (!PL || !PL.grupos.length) return "";
  const linhas = ["LISTA DE COMPRA — " + dlonga(hojeISO()), ""];
  PL.grupos.forEach(g => {
    linhas.push(g.nome + (g.nome.startsWith("SEM PREÇO") ? "" : " — " + brl(g.total)));
    g.itens.forEach(l => linhas.push("• " + l.nome + ": " + nq(l.comprar) + " " + l.un + (l.melhor ? " × " + brl(l.melhor.p) + " = " + brl(l.custo) : "")));
    linhas.push("");
  });
  linhas.push("Total estimado: " + brl(PL.custo));
  return linhas.join("\n");
}
function recalcularCompras() {
  $("#resultado").innerHTML = resultadoHTML();
  $("#lista-corpo").innerHTML = listaFornecedorHTML();
  $("#ordem-corpo").innerHTML = ordemHTML();
}
function recalcNec() {
  $("#nec-lista").innerHTML = necHTML();
  $("#btn-limpar").hidden = !DB.nec.length;
  recalcularCompras();
}

/* ações da tela */
function resolverProduzivel(txt) { return resolverCodigo(txt, c => !!DB.receitas[c]); }
Entradas["produto-un"] = () => { const c = resolverProduzivel($("#produto").value); $("#un-tag").textContent = c ? "Quantidade em " + DB.receitas[c].u : ""; };
document.addEventListener("input", ev => { if (ev.target.id === "produto") Entradas["produto-un"](); });
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && (ev.target.id === "produto" || ev.target.id === "qtd-add")) { ev.preventDefault(); Acoes["add-produto"](); } });

Acoes["add-produto"] = () => {
  const cod = resolverProduzivel($("#produto").value), qtd = num($("#qtd-add").value), err = $("#erro-add");
  if (!cod) { err.textContent = "Escolha um produto da lista."; return; }
  if (!(qtd > 0)) { err.textContent = "Informe uma quantidade maior que zero."; return; }
  err.textContent = "";
  const ja = DB.nec.find(n => n.cod === cod);
  if (ja) ja.qtd = r3(Number(ja.qtd) + qtd); else DB.nec.push({ cod, qtd });
  $("#produto").value = ""; $("#qtd-add").value = ""; $("#un-tag").textContent = "";
  Banco.salvar(); recalcNec(); $("#produto").focus();
};
Acoes.remover = el => { DB.nec.splice(Number(el.dataset.idx), 1); Banco.salvar(); recalcNec(); };
Acoes["limpar-nec"] = async () => { if (await confirmar("Limpar toda a necessidade de produção?", "Limpar")) { DB.nec = []; Banco.salvar(); recalcNec(); } };
Entradas["nec-qtd"] = el => {
  const n = DB.nec[Number(el.dataset.idx)];
  if (n) { n.qtd = el.value === "" ? 0 : Number(el.value); Banco.salvar(); recalcularCompras(); }
};
Acoes.abrir = el => {
  const c = el.dataset.cod; abertos.has(c) ? abertos.delete(c) : abertos.add(c);
  $("#resultado").innerHTML = resultadoHTML();
  const b = document.querySelector('[data-acao="abrir"][data-cod="' + CSS.escape(c) + '"]'); if (b) b.focus();
};
Mudancas.cfg = el => {
  DB.cfg[el.dataset.cfg] = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.cfg === "custoModo") _idx = null;
  Banco.salvar();
  if (rotaAtual() === "producao" && el.dataset.cfg !== "custoModo") recalcularCompras(); else atualizarTela();
};
function salvarCotacao(cod, forn, valor) {
  const p = num(valor);
  if (!forn) return;
  if (!valor || !(p > 0)) { if (DB.cot[cod]) { delete DB.cot[cod][forn]; if (!Object.keys(DB.cot[cod]).length) delete DB.cot[cod]; } }
  else (DB.cot[cod] = DB.cot[cod] || {})[forn] = { p, d: hojeISO() };
  Banco.salvar(); recalcularCompras();
}
Mudancas.cotacao = el => salvarCotacao(el.dataset.cod, el.dataset.forn, el.value);
Acoes.cotar = el => { const c = el.dataset.cod; salvarCotacao(c, $("#cq-f-" + CSS.escape(c)).value, $("#cq-p-" + CSS.escape(c)).value); };

/* registrar compra */
function ultimasComprasHTML(cod) {
  let lista = DB.compras;
  if (cod) lista = lista.filter(c => c[2] === cod);
  const ult = lista.slice(-400).sort((a, b) => a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : 0).slice(0, cod ? 8 : 15);
  return `<h3 style="margin:1rem 0 .5rem">${cod ? "Últimas compras deste item" : "Últimas compras registradas"}</h3>` + tabela([
    { t: "Data", v: c => dcurta(c[0]) }, { t: "Fornecedor", v: c => c[1] },
    ...(cod ? [] : [{ t: "Item", h: c => `${esc(nomeDe(c[2]))} <small class="muted">${esc(c[2])}</small>` }]),
    { t: "Qtd", n: true, v: c => c[3] != null ? nq(c[3]) + " " + unDe(c[2]) : "—" }, { t: "Preço", n: true, v: c => brl(c[4]) }
  ], ult, { vazio: cod ? "Nenhuma compra registrada para este item." : "Nenhuma compra registrada ainda." });
}
Acoes["dlg-compra"] = el => {
  const cod = el && el.dataset ? el.dataset.cod : null;
  const l = cod && PL ? PL.linhas.find(x => x.cod === cod) : null, m = l && l.melhor;
  const insumos = DB.insumos.slice().sort((a, b) => a.n.localeCompare(b.n, "pt-BR"));
  const fornecedores = fornecedoresNomes();
  const fornInicial = m && m.f ? m.f : (Est.compraForn && fornecedores.includes(Est.compraForn) ? Est.compraForn : "");
  const brlUn = n => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 2, maximumFractionDigits: 4 }).format(n);
  const lancados = [];
  abrir(`<form id="f-compra" novalidate><h2>Registrar compra</h2>
    <div class="grade2">
      <div class="campo"><label for="c-forn">Fornecedor</label><select id="c-forn">${fornecedores.map(f => `<option ${fornInicial === f ? "selected" : ""}>${esc(f)}</option>`).join("")}</select></div>
      <div class="campo"><label for="c-data">Data</label><input id="c-data" type="date" value="${hojeISO()}"></div>
    </div>
    <div class="campo"><label for="c-item">Matéria-prima</label><input id="c-item" list="c-lista" autocomplete="off" value="${l ? esc(cod + " — " + l.nome + " (" + l.un + ")") : ""}">
      <datalist id="c-lista">${insumos.map(i => `<option value="${esc(i.c + " — " + i.n + " (" + i.u + ")")}"></option>`).join("")}</datalist><div class="erro" id="e-item"></div></div>
    <div class="grade4">
      <div class="campo"><label for="c-qtd">Qtde</label><input id="c-qtd" type="number" min="0" step="any" inputmode="decimal" value="${l ? esc(l.comprar) : ""}"><div class="erro" id="e-qtd"></div></div>
      <div class="campo"><label for="c-un">Uni. medida</label><input id="c-un" readonly tabindex="-1" value="${l ? esc(l.un) : ""}"></div>
      <div class="campo"><label for="c-total">Preço total</label><input id="c-total" class="dinheiro" type="text" inputmode="decimal" autocomplete="off" placeholder="R$ 0,00" value="${l && m ? brl(r2(m.p * l.comprar)) : ""}"><div class="erro" id="e-preco"></div></div>
      <div class="campo"><label for="c-unit">Preço unitário (calculado)</label><input id="c-unit" readonly tabindex="-1"></div>
    </div>
    <p class="muted">Cada item lançado entra no histórico de preços e soma no estoque da matéria-prima. O fornecedor e a data ficam mantidos para o próximo item.</p>
    <div class="rodape-dlg"><button type="button" data-acao="fechar">Fechar</button><button type="submit" class="primario">Lançar item</button></div>
    <div id="c-sessao"></div>
    <div id="c-ultimas">${ultimasComprasHTML(cod)}</div></form>`, true);
  const codAtual = () => resolverCodigo($("#c-item").value, k => idx().ins.has(k));
  const recalcular = () => {
    const c = codAtual(), q = num($("#c-qtd").value), t = num($("#c-total").value);
    $("#c-un").value = c ? unDe(c) : "";
    $("#c-unit").value = c && q > 0 && t > 0 ? brlUn(t / q) + " / " + unDe(c) : (q > 0 && t > 0 ? brlUn(t / q) : "");
  };
  const sessaoHTML = () => lancados.length ? `<h3 style="margin:1rem 0 .5rem">Lançados nesta sessão (${lancados.length}) — ${esc($("#c-forn").value)}</h3>` + tabela([
    { t: "Matéria-prima", h: x => `${esc(nomeDe(x.c))} <small class="muted">${esc(x.c)}</small>` },
    { t: "Qtde", n: true, v: x => nq(x.q) + " " + unDe(x.c) }, { t: "Preço total", n: true, v: x => brl(x.t) }, { t: "Preço unitário", n: true, v: x => brlUn(x.p) }
  ], lancados.slice().reverse()) : "";
  $("#c-item").focus();
  recalcular();
  $("#c-item").addEventListener("input", () => { recalcular(); $("#c-ultimas").innerHTML = ultimasComprasHTML(codAtual()); });
  $("#c-qtd").addEventListener("input", recalcular);
  $("#c-total").addEventListener("input", recalcular);
  $("#c-total").addEventListener("blur", recalcular);
  $("#f-compra").onsubmit = ev => {
    ev.preventDefault();
    const c = codAtual(), q = num($("#c-qtd").value), t = num($("#c-total").value);
    $("#e-item").textContent = c ? "" : "Escolha uma matéria-prima da lista.";
    $("#e-qtd").textContent = q > 0 ? "" : "Informe a quantidade.";
    $("#e-preco").textContent = t > 0 ? "" : "Informe o preço total pago.";
    if (!c || !(q > 0) || !(t > 0)) return;
    const forn = $("#c-forn").value, p = Math.round(t / q * 1e6) / 1e6;

function dadosPainel(ano) {
  const z = () => Array(12).fill(0);
  const D = { vend: z(), com: z(), sem: z(), ni: z(), cmv: z(), tipo: {}, desc: {}, todas: z() };
  DB.vendas.forEach(v => {

    D.cmv[i] += v.q * custoVendaDe(v.c);

const pxFam = c => DB.familias[famDe(c)] || DB.familias.OUTROS || { dvv: 0, ebitda: 0 };
function periodoDe(ano, mes) {
  if (!mes) return { de: ano + "-01-01", ate: ano + "-12-31" };
  const m = String(mes).padStart(2, "0"), u = new Date(Number(ano), mes, 0).getDate();

function resumoPeriodo(p) {

/* sondagem de DVV: despesas operacionais ÷ faturado nos últimos X meses completos */
function dvvHistorico(X) {
  const fim = mesCompletoPadrao(), ms = [];
  for (let i = X - 1; i >= 0; i--) ms.push(addMeses(primeiroDia(fim), -i).slice(0, 7));
  const M = new Map(ms.map(k => [k, { k, vend: 0, desp: 0 }]));
  const porFam = {};
  DB.vendas.forEach(v => { const o = M.get(v.d.slice(0, 7)); if (o) { o.vend += v.t; const f = famDe(v.c); porFam[f] = (porFam[f] || 0) + v.t; } });
  DB.contas.forEach(c => { const o = c.dp && TIPOS_OPERACIONAIS.includes(c.tipo) ? M.get(c.dp.slice(0, 7)) : null; if (o) o.desp += c.v; });
  const meses = [...M.values()].filter(o => o.vend || o.desp), vend = soma(meses.map(o => o.vend)), desp = soma(meses.map(o => o.desp));
  return { meses, vend, desp, porFam, pct: vend ? desp / vend : null };
}
function estadoFamilias() {
  const e = {};
  familiasLista().forEach(f => { const c = $("#fp-r-" + CSS.escape(f)), d = $("#fp-d-" + CSS.escape(f)), p = DB.familias[f]; e[f] = { rateia: c ? c.checked : p.rateia !== false, dvv: d ? (num(d.value) / 100 || 0) : p.dvv }; });
  return e;
}
function dvvRateio(H, est) {
  let vPart = 0, absorvido = 0; const fora = [];
  Object.entries(H.porFam).forEach(([f, v]) => { const e = est[f] || { rateia: true }; if (e.rateia) vPart += v; else { absorvido += v * e.dvv; fora.push(f + " " + pctf(e.dvv)); } });
  return { vPart, absorvido, fora, pct: vPart > 0 ? (H.desp - absorvido) / vPart : null };
}
function dvvHistHTML(X) {
  const H = dvvHistorico(X), rot = k => MESES3[Number(k.slice(5)) - 1] + "/" + k.slice(2, 4);
  if (!H.vend) return '<p class="vazio">Sem vendas nesse intervalo.</p>';
  const RT = dvvRateio(H, estadoFamilias()), okp = RT.pct != null && RT.pct >= 0 && RT.pct < 1;
  return `<p style="margin:.5rem 0"><strong>${brl(H.desp)}</strong> de despesas ÷ <strong>${brl(H.vend)}</strong> faturados = <strong>DVV de ${pctf(H.pct)}</strong>
    <span class="muted">(${H.meses.length} ${H.meses.length === 1 ? "mês" : "meses"} com movimento, de ${rot(H.meses[0].k)} a ${rot(H.meses[H.meses.length - 1].k)})</span></p>
    <details><summary>Ver mês a mês</summary><div class="tabela"><table><thead><tr><th>Mês</th><th class="n">Faturado</th><th class="n">Despesas</th><th class="n">DVV</th></tr></thead><tbody>
    ${H.meses.map(o => `<tr><td>${rot(o.k)}</td><td class="n">${brl(o.vend)}</td><td class="n">${brl(o.desp)}</td><td class="n">${o.vend ? pctf(o.desp / o.vend) : "—"}</td></tr>`).join("")}</tbody></table></div></details>
    ${RT.fora.length ? `<p style="margin:.5rem 0"><strong>Fora do rateio:</strong> ${esc(RT.fora.join(", "))}. Elas absorvem <strong>${brl(RT.absorvido)}</strong>; ${okp ? `as demais famílias precisam de <strong>DVV de ${pctf(RT.pct)}</strong> para fechar o total de ${brl(H.desp)}.` : "isso já passa do total de despesas do período; reduza o percentual delas."}</p>` : ""}
    ${okp ? `<button type="button" id="fp-usar" data-pct="${r2(RT.pct * 100)}">Usar ${pctf(RT.pct)} ${RT.fora.length ? "nas famílias do rateio" : "em todas as famílias"}</button>` : ""}
    <p class="muted" style="margin:.4rem 0 0;font-size:.85rem">Só preenche os campos abaixo; nada muda até você clicar em Salvar parâmetros.</p>`;

/* ficha técnica */
function dependeDe(mp, alvo, visto = new Set()) {
  if (mp === alvo) return true;
  const r = DB.receitas[mp]; if (!r || visto.has(mp)) return false;
  visto.add(mp);
  return r.i.some(([k]) => dependeDe(k, alvo, visto));
}
function abrirFicha(code) {
  const real = DB.receitas[code];
  const p0 = DB.produtos[code];
  if (!real && !p0) return;
  const r = real || { n: p0.n, u: p0.u, t: "P", f: p0.g, i: [] };
  Est._sujo = true;
  const rend = r.i.length ? r.i[0][2] : 1;

    const comp = !!DB.receitas[mp], cu = custoUn(mp);

  const code = el.dataset.cod, mp = resolverCodigo($("#fi-i").value, k => idx().ins.has(k) || !!DB.receitas[k]);
  const q = num($("#fi-q").value), s = num($("#fi-s").value);
  if (!mp) { $("#e-fi").textContent = "Escolha um ingrediente da lista."; return; }

  if (DB.receitas[mp] && dependeDe(mp, code)) { $("#e-fi").textContent = "Esse preparo usa este item e criaria um ciclo."; return; }

    const p = DB.produtos[code];

  }
  DB.receitas[code].i.push([mp, q, s]); Banco.mudou(); abrirFicha(code);

/* excluir produto ou componente do cadastro */
function usosDoItem(c) {
  const temFicha = !!DB.receitas[c];
  return {
    vendas: DB.vendas.filter(v => v.c === c).length,
    producao: DB.entprod.filter(e => e[1] === c).length,
    /* só conta como "usado em outra ficha" se este código tiver, de fato, uma ficha própria — */
    /* caso contrário o código é só uma coincidência com uma matéria-prima de mesmo número */
    ingrediente: temFicha ? Object.entries(DB.receitas).filter(([k, r]) => k !== c && r.i.some(i => i[0] === c)).map(([, r]) => r.n) : []
  };
}
Acoes["item-excluir"] = async el => {
  const c = el.dataset.cod, r = DB.receitas[c], p = DB.produtos[c];
  if (!r && !p) return;
  const nome = p ? p.n : r.n, tipo = p ? "produto" : "componente";
  const u = usosDoItem(c);
  if (u.ingrediente.length) {
    const lista = u.ingrediente.slice(0, 3).join(", ") + (u.ingrediente.length > 3 ? " e mais " + (u.ingrediente.length - 3) : "");
    aviso(`${nome} é usado na ficha técnica de ${lista} e não pode ser excluído. Remova-o dessas fichas primeiro.`, "erro");
    return;
  }
  let msg = `Excluir definitivamente ${nome} (${c}) do cadastro? Esta ação não pode ser desfeita.`;
  const historico = [];
  if (u.vendas) historico.push(u.vendas + " venda" + (u.vendas > 1 ? "s" : ""));
  if (u.producao) historico.push(u.producao + " entrada" + (u.producao > 1 ? "s" : "") + " de produção");
  if (historico.length) msg += ` Há ${historico.join(" e ")} no histórico ligadas a este código; elas continuam registradas, mas o ${tipo} vai aparecer como não cadastrado.`;
  if (await confirmar(msg, "Excluir " + tipo)) {
    delete DB.produtos[c]; delete DB.receitas[c];
    DB.nec = DB.nec.filter(n => n.cod !== c);
    Banco.mudou(); if (dlg.open) fechar(); aviso((p ? "Produto" : "Componente") + " excluído do cadastro."); atualizarTela();
  }
};

function filtroEstoque() {

  F.aba = F.aba || "mp"; F.pag = F.pag || 1; F.q = F.q || ""; F.fam = F.fam || ""; F.sit = F.sit || "";
  F.movTipo = F.movTipo || "mp"; F.movQ = F.movQ || ""; F.movPag = F.movPag || 1;
  return F;
}
const ultimaCompraDe = c => { const h = idx().hist.get(c); return h && h.length ? h[h.length - 1].d : ""; };

/* extrato de movimentos: entradas e saídas, com saldo anterior e atual */
function extratoMateriaPrima() {
  const somaMov = new Map();
  DB.mov.forEach(([, c, delta]) => somaMov.set(c, r3((somaMov.get(c) || 0) + delta)));
  const saldo = new Map();
  DB.insumos.forEach(i => saldo.set(i.c, r3((DB.est[i.c] || 0) - (somaMov.get(i.c) || 0))));
  const linhas = DB.mov.map(([d, c, delta, motivo]) => {
    const antes = saldo.get(c) ?? 0, depois = r3(antes + delta);
    saldo.set(c, depois);
    return { d, c, n: nomeDe(c), u: unDe(c), tipo: delta >= 0 ? "ENTRADA" : "SAÍDA", qtd: Math.abs(delta), antes, depois, det: motivo };
  });
  return linhas.reverse();
}
function extratoProdutos() {
  const eventos = [];
  DB.entprod.forEach(([d, c, q], i) => eventos.push({ d, c, qtd: q, tipo: "ENTRADA", seq: i, det: "PRODUÇÃO" }));
  DB.vendas.forEach(v => { if (v.q) eventos.push({ d: v.d, c: v.c, qtd: v.q, tipo: "SAÍDA", seq: 1e9 + v.id, det: v.cli === "PERDA" ? "PERDA" : "VENDA" + (v.cli ? " · " + v.cli : "") }); });
  eventos.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.seq - b.seq);
  const saldo = new Map();
  const linhas = eventos.map(e => {
    const antes = saldo.get(e.c) || 0, depois = r3(antes + (e.tipo === "ENTRADA" ? e.qtd : -e.qtd));
    saldo.set(e.c, depois);
    return { ...e, n: nomeProduto(e.c), u: (DB.produtos[e.c] || {}).u || "", antes, depois };
  });
  return linhas.reverse();

"use strict";

/* ===== DRE por família e produto (rateio dos custos pela venda) ===== */
const TIPOS_RATEIO = ["INDIRETO", "FIXO", "FINANCEIRO", "TRIBUTÁRIO", "VARIÁVEL"];
function filtroDre() {
  const F = Est.dre = Est.dre || {};
  if (F.de === undefined) { const b = mesCompletoPadrao(); F.de = primeiroDia(b); F.ate = ultimoDia(b); }
  F.abertos = F.abertos || new Set();
  return F;
}
/* mês da última venda, se ele já terminou; senão o mês anterior */
function mesCompletoPadrao() { const u = ultimaVenda(); return u === ultimoDia(u) ? u : addMeses(primeiroDia(u), -1); }
function calcularDre(de, ate) {
  const vendas = DB.vendas.filter(v => v.d >= de && v.d <= ate);
  const totalVend = vendas.reduce((s, v) => s + v.t, 0);
  const tot = {};
  DB.contas.forEach(c => { if (c.dp && c.dp >= de && c.dp <= ate) tot[c.tipo] = (tot[c.tipo] || 0) + c.v; });
  const taxa = t => totalVend ? (tot[t] || 0) / totalVend : 0;
  const porProd = new Map();
  vendas.forEach(v => { const o = porProd.get(v.c) || { c: v.c, q: 0, t: 0, custo: 0 }; o.q += v.q; o.t += v.t; o.custo += v.q * custoVendaDe(v.c); porProd.set(v.c, o); });
  const dre = o => {
    const r = {}; TIPOS_RATEIO.forEach(t => { r[t] = o.t * taxa(t); });
    o.rateio = r; o.lucro = o.t - o.custo - TIPOS_RATEIO.reduce((s, t) => s + r[t], 0);
    o.inv = o.t * taxa("INVESTIMENTO"); o.liq = o.lucro - o.inv; return o;
  };
  const fam = new Map();
  porProd.forEach(o => {
    dre(o);
    const g = famDe(o.c), f = fam.get(g) || { g, q: 0, t: 0, custo: 0, rateio: {}, lucro: 0, inv: 0, liq: 0, itens: [] };
    f.q += o.q; f.t += o.t; f.custo += o.custo; f.lucro += o.lucro; f.inv += o.inv; f.liq += o.liq;
    TIPOS_RATEIO.forEach(t => { f.rateio[t] = (f.rateio[t] || 0) + o.rateio[t]; });
    f.itens.push(o); fam.set(g, f);
  });
  const familias = [...fam.values()].sort((a, b) => b.t - a.t);
  familias.forEach(f => f.itens.sort((a, b) => b.t - a.t));
  const T = { g: "Total", q: 0, t: 0, custo: 0, rateio: {}, lucro: 0, inv: 0, liq: 0 };
  familias.forEach(f => { T.q += f.q; T.t += f.t; T.custo += f.custo; T.lucro += f.lucro; T.inv += f.inv; T.liq += f.liq; TIPOS_RATEIO.forEach(t => { T.rateio[t] = (T.rateio[t] || 0) + f.rateio[t]; }); });
  return { familias, T, tot, totalVend, taxa };
}
Telas.dre = {
  titulo: "DRE",
  render() {
    const F = filtroDre();
    const R = calcularDre(F.de || "0000-01-01", F.ate || "9999-12-31");
    const linha = (o, o2 = {}) => {

/* ===== Cadastros: fornecedores, insumos e descrições de contas ===== */
function filtroCad() { const F = Est.cadastros = Est.cadastros || {}; F.aba = F.aba || "cli"; F.q = F.q || ""; F.pag = F.pag || 1; return F; }
const comprasDe = n => DB.compras.filter(c => c[1] === n).length;
/* compras (pedidos distintos) e última compra de cada cliente, a partir das vendas */
function estatClientes() {
  const m = new Map();
  DB.vendas.forEach(v => {
    const k = normNome(v.cli); if (!k) return;
    const o = m.get(k) || { pedidos: new Set(), ult: "" };
    o.pedidos.add(chavePedido(v)); if (v.d > o.ult) o.ult = v.d; m.set(k, o);
  });
  return m;
}
function cadastrosResultadoHTML() {
  const F = filtroCad(), q = semAcento(F.q);
  if (F.aba === "cli") {
    const est = estatClientes(), dig = soDigitos(F.q);
    const lista = DB.clientes.filter(c => (!q || semAcento(c.nome).includes(q) || (dig && soDigitos(c.tel).includes(dig))) && (F.dados !== "inc" || !c.tel || !c.end))
      .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
    const incompletos = DB.clientes.filter(c => !c.tel || !c.end).length;
    const pg = paginar(lista, F.pag || 1, 100);
    return `<div class="resumo"><div><div class="rot">Clientes</div><div class="val">${nfInt.format(DB.clientes.length)}</div></div>
      <div><div class="rot">Sem celular ou endereço</div><div class="val ${incompletos ? "ruim" : ""}">${nfInt.format(incompletos)}</div></div></div>` +
      tabela([{ t: "Nome", v: c => c.nome }, { t: "Celular", h: c => c.tel ? esc(c.tel) : '<span class="tag aviso">falta</span>' },
        { t: "Endereço", h: c => c.end ? esc(c.end) : '<span class="tag aviso">falta</span>' },
        { t: "Compras", n: true, v: c => (est.get(c.nome) ? est.get(c.nome).pedidos.size : 0) }, { t: "Última compra", v: c => est.get(c.nome) && est.get(c.nome).ult ? dlonga(est.get(c.nome).ult) : "—" },
        { t: "", h: c => `<button type="button" class="mini" data-acao="cli-editar" data-id="${c.id}">Editar</button> <button type="button" class="mini perigo" data-acao="cli-excluir" data-id="${c.id}" aria-label="Excluir ${esc(c.nome)}">Excluir</button>` }],
        pg.itens, { vazio: "Nenhum cliente encontrado." }) + pagHTML(pg, "cad-pag");
  }
  if (F.aba === "insumo") {
    const uso = new Map(); DB.compras.forEach(c => uso.set(c[2], (uso.get(c[2]) || 0) + 1));
    const lista = DB.insumos.filter(i => !q || semAcento(i.n).includes(q) || i.c.includes(q)).sort((a, b) => a.n.localeCompare(b.n, "pt-BR"));
    return tabela([{ t: "Código", v: i => i.c }, { t: "Matéria-prima", v: i => i.n }, { t: "Un", v: i => i.u }, { t: "Centro de custo", v: i => i.cc || "—" },
      { t: "Mínimo", n: true, v: i => i.m ? nq(i.m) : "—" }, { t: "Compras", n: true, v: i => uso.get(i.c) || 0 },
      { t: "", h: i => `<button type="button" class="mini" data-acao="ins-editar" data-cod="${esc(i.c)}">Editar</button> <button type="button" class="mini perigo" data-acao="ins-excluir" data-cod="${esc(i.c)}" aria-label="Excluir ${esc(i.n)}">Excluir</button>` }],
      lista.slice(0, 300), { vazio: "Nenhuma matéria-prima encontrada." }) + (lista.length > 300 ? `<p class="muted" style="padding:.6rem 1rem">Mostrando 300 de ${lista.length}. Refine a busca.</p>` : "");
  }
  if (F.aba === "desc") {
    const uso = new Map(); DB.contas.forEach(c => uso.set(c.desc, (uso.get(c.desc) || 0) + 1));
    const lista = DB.descricoes.filter(d => !q || semAcento(d).includes(q));
    return tabela([{ t: "Descrição", v: d => d }, { t: "Tipo de custo padrão", h: d => `<select data-mud="desc-tipo" data-desc="${esc(d)}" style="width:auto" aria-label="Tipo de ${esc(d)}">${opcoes(DB.tipos, DB.tipoDesc[d])}</select>` },
      { t: "Lançamentos", n: true, v: d => uso.get(d) || 0 }, { t: "", h: d => `<button type="button" class="mini perigo" data-acao="desc-excluir" data-desc="${esc(d)}">Excluir</button>` }], lista, { vazio: "Nenhuma descrição." });
  }
  const lista = DB.fornecedores.filter(f => !q || semAcento(f.n).includes(q)).sort((a, b) => a.n.localeCompare(b.n, "pt-BR"));
  return tabela([{ t: "Fornecedor", v: f => f.n }, { t: "Endereço", v: f => f.end || "—" }, { t: "Contato", v: f => f.tel || "—" }, { t: "Compras", n: true, v: f => comprasDe(f.n) },
    { t: "", h: f => `<button type="button" class="mini" data-acao="forn-editar" data-n="${esc(f.n)}">Editar</button> <button type="button" class="mini perigo" data-acao="forn-excluir" data-n="${esc(f.n)}" aria-label="Excluir ${esc(f.n)}">Excluir</button>` }],
    lista, { vazio: "Nenhum fornecedor cadastrado." });
}

function formForn(f, titulo) {
  abrir(`<form id="f-forn" novalidate><h2>${esc(titulo)}</h2>
    <div class="campo"><label for="fo-n">Nome</label><input id="fo-n" value="${esc(f.n)}"></div>
    <div class="campo"><label for="fo-e">Endereço</label><input id="fo-e" value="${esc(f.end || "")}"></div>

    <div class="erro" id="e-fo" role="alert"></div>
    <div class="rodape-dlg"><button type="button" data-acao="fechar">Cancelar</button><button type="submit" class="primario">Salvar fornecedor</button></div></form>`);
  $("#fo-n").focus();
}
Acoes["forn-novo"] = () => {
  formForn({ n: "" }, "Novo fornecedor");
  $("#f-forn").onsubmit = ev => {
    ev.preventDefault(); const n = nfCompra($("#fo-n").value);
    if (!n) { $("#e-fo").textContent = "Informe o nome."; return; }
    if (DB.fornecedores.some(f => f.n === n)) { $("#e-fo").textContent = "Já existe um fornecedor com esse nome."; return; }
    DB.fornecedores.push({ n, end: $("#fo-e").value.trim(), tel: $("#fo-t").value.trim() }); Banco.mudou(); fechar(); aviso("Fornecedor cadastrado."); atualizarTela();
  };
};
Acoes["forn-editar"] = el => {
  const f = DB.fornecedores.find(x => x.n === el.dataset.n); if (!f) return;
  formForn(f, "Editar fornecedor");
  $("#f-forn").onsubmit = ev => {
    ev.preventDefault(); const n = $("#fo-n").value.trim().toUpperCase();
    if (!n) { $("#e-fo").textContent = "Informe o nome."; return; }
    if (n !== f.n && DB.fornecedores.some(x => x.n === n)) { $("#e-fo").textContent = "Já existe um fornecedor com esse nome."; return; }
    if (n !== f.n) { DB.compras.forEach(c => { if (c[1] === f.n) c[1] = n; }); Object.values(DB.cot).forEach(o => { if (o[f.n]) { o[n] = o[f.n]; delete o[f.n]; } }); f.n = n; }
    f.end = $("#fo-e").value.trim(); f.tel = $("#fo-t").value.trim(); Banco.mudou(); fechar(); aviso("Fornecedor atualizado."); atualizarTela();
  };
};
Acoes["forn-excluir"] = async el => {
  const n = el.dataset.n, c = comprasDe(n);
  if (c) { aviso(`${n} tem ${c} compras no histórico e não pode ser excluído.`, "erro"); return; }
  if (await confirmar(`Excluir o fornecedor ${n}?`, "Excluir")) { DB.fornecedores = DB.fornecedores.filter(f => f.n !== n); Banco.mudou(); atualizarTela(); }
};

  const s = String(v ?? "").trim(); let m;
  const ok = (y, mo, d) => { const t = new Date(Date.UTC(y, mo - 1, d)); return t.getUTCFullYear() === y && t.getUTCMonth() === mo - 1 && t.getUTCDate() === d ? y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0") : null; };
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) { let y = +m[3]; if (y < 100) y += 2000; return ok(y, +m[2], +m[1]); }
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return ok(+m[1], +m[2], +m[3]);
  if (/^\d{5}$/.test(s)) return dataISO(Number(s));
  return null;
};

/* ===== Motoboy: horas e entregas lançadas, pagamentos fracionados, saldo a pagar ===== */

function minutosTurno(ini, fim) {

}
const motoProxId = lista => lista.reduce((m, x) => Math.max(m, x.id), 0) + 1;

/* tudo o que o período mostra, mais o saldo anterior, o saldo a pagar e o repasse de taxas a repassar (mid: 0 = todos, -1 = sem motoboy) */
function motoCalc(de, ate, mid) {
  const ok = x => okMoto(x, mid || 0);
  const ord = (a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
  const T = DB.motoTurnos.filter(t => ok(t) && dentro(t.d, de, ate)).sort((a, b) => ord(a, b) || a.ini.localeCompare(b.ini));
  const Eall = motoEntregas().filter(e => ok(e) && dentro(motoDataEnt(e), de, ate)).sort((a, b) => (motoDataEnt(a) < motoDataEnt(b) ? -1 : motoDataEnt(a) > motoDataEnt(b) ? 1 : 0) || a.n - b.n);
  const E = Eall.filter(motoConta);
  const P = DB.motoPagtos.filter(p => ok(p) && dentro(p.d, de, ate)).sort((a, b) => ord(a, b) || a.id - b.id);
  const min = T.reduce((s, t) => s + t.min, 0), vh = r2(T.reduce((s, t) => s + t.v, 0));

  const pagAnt = de ? r2(DB.motoPagtos.filter(p => ok(p) && antes(p.d)).reduce((s, p) => s + motoPagValor(p), 0)) : 0;
  const ant = r2(ganhoAnt - pagAnt);

Mudancas["moto-rep"] = el => { const F = motoFiltro(); F.rep = el.value; F.pag = 1; atualizarTela(); };

/* ----- turnos ----- */
function motoKmToggle() {
  const box = $("#mt-km"); if (!box) return;
  const car = $("#mt-v").value === "carro", ki = $("#mt-ki");
  box.style.display = car ? "flex" : "none";
  if (car && !ki.value.trim()) {
    const u = DB.motoTurnos.filter(t => t.car && t.kmf !== undefined).sort((a, b) => (a.d > b.d ? -1 : a.d < b.d ? 1 : 0) || b.id - a.id)[0];
    if (u) ki.value = String(u.kmf).replace(".", ",");
  }
}
Mudancas["moto-sel"] = el => {
  if (el.id === "mt-v") { $("#mt-ki").value = ""; $("#mt-kf").value = ""; }
  motoKmToggle(); Entradas["moto-calc"]();
};
Entradas["moto-calc"] = () => {
  const el = $("#mt-calc"); if (!el) return;
  const m = motoPorId(Number($("#mt-m").value)), car = $("#mt-v").value === "carro", min = minutosTurno($("#mt-i").value, $("#mt-f").value);
  const ki = num($("#mt-ki").value), kf = num($("#mt-kf").value);
  let t = isNaN(min) ? "—" : hm(min) + (m ? " = " + brl(r2(min / 60 * m.vh)) : "");
  if (car && kf >= ki) { const km = r2(kf - ki), cb = custoComb(km); t += " · " + nKm(km) + " km" + (cb ? " · combustível " + brl(cb) : (DB.cfg.carroKml > 0 && DB.cfg.carroComb > 0 ? "" : " · cadastre o consumo do carro")); }
  el.textContent = t;
};
Acoes["moto-add"] = () => {
  const F = motoFiltro(), m = motoPorId(Number($("#mt-m").value)), car = $("#mt-v").value === "carro";
  const d = $("#mt-d").value, ini = $("#mt-i").value, fim = $("#mt-f").value, min = minutosTurno(ini, fim), erro = t => { $("#e-mt").textContent = t; };
  if (!m) { erro("Selecione o motoboy."); return; }
  if (!d || isNaN(min)) { erro("Informe a data, a hora de início e a hora de fim (diferentes)."); return; }
  const T = { id: motoProxId(DB.motoTurnos), mid: m.id, d, ini, fim, min, vh: m.vh, v: r2(min / 60 * m.vh) };
  if (car) {
    const ki = num($("#mt-ki").value), kf = num($("#mt-kf").value);
    if (!(ki >= 0) || !(kf >= ki)) { erro("Informe o KM inicial e o KM final do carro da empresa (o final não pode ser menor que o inicial)."); return; }
    Object.assign(T, { car: true, kmi: ki, kmf: kf, km: r2(kf - ki), cb: custoComb(r2(kf - ki)) });
  }
  DB.motoTurnos.push(T); F.d = d; F.lm = m.id; F.lv = car ? "carro" : "moto";
  Banco.mudou(); atualizarTela(); aviso(m.nome + ": turno registrado, " + hm(min) + ".");
};

    <div class="campo"><label for="me-v">Valor do turno</label><input id="me-v" class="dinheiro" type="text" inputmode="decimal" value="${brl(t.v)}"></div></div>
    <div class="grade2" id="me-kmbox">
    <div class="campo"><label for="me-ki">KM inicial</label><input id="me-ki" type="text" inputmode="decimal" value="${t.kmi !== undefined ? String(t.kmi).replace(".", ",") : ""}"></div>
    <div class="campo"><label for="me-kf">KM final</label><input id="me-kf" type="text" inputmode="decimal" value="${t.kmf !== undefined ? String(t.kmf).replace(".", ",") : ""}"></div>
    <div class="campo"><label for="me-cb">Combustível do turno</label><input id="me-cb" class="dinheiro" type="text" inputmode="decimal" value="${t.cb ? brl(t.cb) : ""}"></div></div>
    <p class="muted">O valor do turno é recalculado quando você muda horário ou valor da hora; o combustível, quando muda o KM. Depois disso pode ser digitado à mão.</p>
    <div class="erro" id="e-me" role="alert"></div>
    <div class="rodape-dlg"><button type="button" data-acao="fechar">Cancelar</button><button type="submit" class="primario">Salvar</button></div></form>`);
  const car = () => $("#me-vc").value === "carro";
  const mostra = () => { $("#me-kmbox").style.display = car() ? "" : "none"; };
  const recalc = () => {
    const min = minutosTurno($("#me-i").value, $("#me-f").value), vh = num($("#me-h").value);
    if (!isNaN(min) && vh >= 0) $("#me-v").value = brl(r2(min / 60 * vh));
  };
  const recalcCb = () => { const ki = num($("#me-ki").value), kf = num($("#me-kf").value); if (car() && kf >= ki) { const c = custoComb(r2(kf - ki)); $("#me-cb").value = c ? brl(c) : ""; } };
  ["#me-i", "#me-f", "#me-h"].forEach(s => $(s).addEventListener("input", recalc));
  ["#me-ki", "#me-kf"].forEach(s => $(s).addEventListener("input", recalcCb));
  $("#me-vc").addEventListener("change", () => { mostra(); recalcCb(); });
  mostra();
  $("#f-moto").onsubmit = ev => {
    ev.preventDefault();
    const d = $("#me-d").value, ini = $("#me-i").value, fim = $("#me-f").value, min = minutosTurno(ini, fim), vh = num($("#me-h").value), v = num($("#me-v").value);
    if (!d || isNaN(min) || !(vh >= 0) || !(v >= 0)) { $("#e-me").textContent = "Confira data, horários e valores."; return; }
    const mid = Number($("#me-m").value) || 0;
    const nova = { d, ini, fim, min, vh: r2(vh), v: r2(v) };
    if (car()) {
      const ki = num($("#me-ki").value), kf = num($("#me-kf").value);
      if (!(ki >= 0) || !(kf >= ki)) { $("#e-me").textContent = "Informe o KM inicial e o KM final (o final não pode ser menor que o inicial)."; return; }
      const cb = num($("#me-cb").value);
      Object.assign(nova, { car: true, kmi: ki, kmf: kf, km: r2(kf - ki), cb: cb >= 0 ? r2(cb) : 0 });
    }
    ["car", "kmi", "kmf", "km", "cb"].forEach(k => delete t[k]);
    Object.assign(t, nova);
    if (mid) t.mid = mid; else delete t.mid;
    Banco.mudou(); fechar(); atualizarTela();
  };
};

/* ===== Funcionários: relatório / comprovante do período ===== */
function funcRelHTML(de, ate, fid) {
  const th = (t, r) => `<th style="border:1px solid #000;padding:3px 6px;background:#eee;text-align:${r ? "right" : "left"}">${t}</th>`;
  const td = (v, r, b) => `<td style="border:1px solid #000;padding:3px 6px;text-align:${r ? "right" : "left"};${b ? "font-weight:700;background:#f6f6f6" : ""}">${v}</td>`;
  const tdc = (v, n) => td(v, false, true).replace("<td ", `<td colspan="${n}" `);
  const tab = (cab, corpo) => `<table style="width:100%;border-collapse:collapse;margin:.3rem 0 .4rem"><thead><tr>${cab}</tr></thead><tbody>${corpo}</tbody></table>`;
  const vazio = n => `<tr><td colspan="${n}" style="border:1px solid #000;padding:3px 6px">Nada no período.</td></tr>`;
  const linha = (rot, v, forte) => `<tr><td style="padding:2px 6px;${forte ? "font-weight:700;border-top:2px solid #000" : ""}">${rot}</td><td style="padding:2px 6px;text-align:right;${forte ? "font-weight:700;border-top:2px solid #000" : ""}">${v}</td></tr>`;
  const periodo = de || ate ? (de ? dlonga(de) : "início") + " a " + (ate ? dlonga(ate) : dlonga(hojeISO())) : "Todo o histórico";
  const lista = funcTodos().filter(f => (!fid || f.id === fid)).map(f => ({ f, X: funcCalc(de, ate, f.id) })).filter(r => r.X.T.length || r.X.P.length || r.X.ant !== 0);
  return lista.map((r, k) => {
    const { f, X } = r;
    const porTaxa = new Map();
    X.T.forEach(t => { const x = porTaxa.get(t.vh) || { min: 0, v: 0 }; x.min += t.min; x.v = r2(x.v + t.v); porTaxa.set(t.vh, x); });
    const subH = [...porTaxa].map(([vh, x]) => `${hm(x.min)} × ${brl(vh)} por hora = ${brl(x.v)}`).join("<br>");
    const lH = X.T.map(t => `<tr>${td(dlonga(t.d))}${td(t.ini)}${td(t.fim)}${td(hm(t.min), true)}${td(brl(t.vh), true)}${td(brl(t.v), true)}</tr>`).join("") || vazio(6);
    const tH = X.T.length ? `<tr>${tdc("Soma", 3)}${td(hm(X.min), true, true)}${td("", true, true)}${td(brl(X.vh), true, true)}</tr>` : "";
    const lP = X.P.map(p => `<tr>${td(dlonga(p.d))}${td(esc(p.obs || ""))}${td(brl(p.total), true)}</tr>`).join("") || vazio(3);
    const tP = X.P.length ? `<tr>${tdc("Soma dos pagamentos", 2)}${td(brl(X.pg), true, true)}</tr>` : "";
    return `<div style="font-size:12px;color:#000;${k ? "page-break-before:always;break-before:page;" : ""}">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:.4rem;margin-bottom:.5rem">
      <div><div style="font-size:1.25em;font-weight:700">TRIGO MINAS</div><div>Comprovante de trabalho e pagamento — Funcionário</div></div>
      <div style="text-align:right">Emitido em ${dlonga(hojeISO())}</div></div>
    <div style="margin-bottom:.5rem"><div><strong>Funcionário:</strong> ${esc(f.nome)}${f.funcao ? " (" + esc(f.funcao) + ")" : ""}</div><div><strong>Período:</strong> ${periodo}</div></div>
    <h3 style="margin:.6rem 0 0;font-size:1em">1. Horas trabalhadas × valor da hora</h3>
    ${tab(th("Data") + th("Entrada") + th("Saída") + th("Horas", true) + th("Valor hora", true) + th("Valor", true), lH + tH)}
    <div style="margin-bottom:.4rem">${subH ? "<strong>Detalhe da soma:</strong><br>" + subH : ""}</div>
    <h3 style="margin:.8rem 0 0;font-size:1em">2. Pagamentos efetuados</h3>
    ${tab(th("Data") + th("Observação") + th("Valor pago", true), lP + tP)}
    <h3 style="margin:.8rem 0 0;font-size:1em">3. Soma total</h3>
    <table style="width:62%;margin-left:auto;border-collapse:collapse">
      ${de ? linha("Saldo anterior ao período", brl(X.ant)) : ""}${linha("Horas trabalhadas (" + hm(X.min) + ")", brl(X.vh))}${linha("Pagamentos efetuados", "− " + brl(X.pg))}${linha("SALDO A PAGAR PELA EMPRESA", brl(X.saldo), true)}</table>
    <div style="display:flex;gap:3rem;margin-top:2.2rem"><div style="flex:1;border-top:1px solid #000;padding-top:3px;text-align:center">${esc(f.nome)}<br>Recebi os valores pagos acima</div><div style="flex:1;border-top:1px solid #000;padding-top:3px;text-align:center">Trigo Minas<br>Pagamento realizado</div></div>
  </div>`;
  }).join("");
}

/* Enter nos itens do pedido: avança de campo (produto → quantidade → preço → total → novo item) e não grava a venda */
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter" || ev.target.tagName !== "INPUT" || !ev.target.closest("#lv-linhas")) return;
  const m = /^lv-([pqut])-(\d+)$/.exec(ev.target.id); if (!m) return;
  ev.preventDefault();
  const prox = { p: "q", q: "u", u: "t" }[m[1]];
  let alvo;
  if (prox) alvo = $("#lv-" + prox + "-" + m[2]);
  else {
    const linhas = [...document.querySelectorAll("#lv-linhas .lv")], pos = linhas.findIndex(l => l.dataset.i === m[2]);
    if (pos === linhas.length - 1) Acoes["lv-add"]();
    const novas = [...document.querySelectorAll("#lv-linhas .lv")];
    alvo = novas[pos + 1].querySelector("input");
  }
  if (alvo) { alvo.focus(); if (alvo.select) alvo.select(); }
});

"use strict";

/* ===== Combos ===== */
function comboCalc(cb) {
  const L = (cb.itens || []).filter(i => DB.produtos[i.c]).map(i => ({ c: i.c, q: i.q, u: DB.produtos[i.c].r || 0 }));
  const bruto = r2(L.reduce((s, l) => s + l.q * l.u, 0));
  const d = cb.dt === "%" ? r2(bruto * (cb.desc || 0) / 100) : r2(cb.desc || 0);
  const desc = Math.min(Math.max(d, 0), bruto);
  return { L, bruto, desc, valor: r2(bruto - desc) };
}
Telas.combos = {
  titulo: "Combos",
  render() {
    const cards = DB.combos.map((cb, k) => {
      const C = comboCalc(cb);
      const corpo = tabela([
        { t: "Qtd", n: true, v: l => String(l.q).replace(".", ",") }, { t: "Produto", v: l => nomeProduto(l.c) },
        { t: "Preço", n: true, v: l => l.u ? brl(l.u) : "sem preço" }, { t: "Subtotal", n: true, v: l => brl(r2(l.q * l.u)) }
      ], C.L, { vazio: "Nenhum item cadastrado.", rodape: C.L.length ? ["", "Soma dos itens", "", brl(C.bruto)] : null });
      return `<section class="painel"><h2 style="font-size:1.05rem;margin:0 0 .5rem">${esc(cb.n)}</h2>${corpo}
        <div class="resumo" style="border:0;padding:.6rem 0 0">
          <div><div class="rot">Desconto${cb.dt === "%" ? " (" + String(cb.desc).replace(".", ",") + "%)" : ""}</div><div class="val">${C.desc ? "−" + brl(C.desc) : brl(0)}</div></div>
          <div><div class="rot">Valor do combo</div><div class="val">${brl(C.valor)}</div></div></div>
        <div style="margin-top:.5rem"><button type="button" class="primario" data-acao="combo-editar" data-k="${k}">${cb.itens.length ? "Editar composição" : "Cadastrar composição"}</button></div></section>`;
    }).join("");
    return cabecalho("Combos", "Cadastre os itens e o desconto de cada combo. Na Nova venda, cada combo é um botão que lança os itens nas linhas do pedido.") +
      `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem">${cards}</div>`;

};

    const ruim = usadas.find(i => !i.c || !(i.q > 0));
    if (ruim) { $("#e-combo").textContent = !ruim.c ? "Produto não encontrado na lista: " + (ruim.bruto || "(vazio)") + "." : "Informe a quantidade de cada item."; return; }
    if (F.dt === "%" && F.desc > 100) { $("#e-combo").textContent = "O desconto percentual não pode passar de 100%."; return; }
    const bruto = comboCalc({ itens: usadas, dt: "R", desc: 0 }).bruto;
    if (F.dt === "R" && F.desc > bruto) { $("#e-combo").textContent = "O desconto é maior que a soma dos itens (" + brl(bruto) + ")."; return; }
    cb.itens = usadas.map(i => ({ c: i.c, q: i.q })); cb.dt = F.dt; cb.desc = F.desc;
    Banco.mudou(); fechar(); aviso(cb.n + " salvo."); atualizarTela();
  };
  const p = document.querySelector(".cbl input[list]"); if (p && !p.value) p.focus();
};
Acoes["combo-lancar"] = el => {
  const cb = DB.combos[Number(el.dataset.k)]; if (!cb) return;
  const C = comboCalc(cb);
  if (!C.L.length) { aviso(cb.n + " ainda não tem itens. Cadastre em Combos.", "erro"); return; }
  const partes = ratearAjuste(C.L.map(l => r2(l.q * l.u)), -C.desc);
  C.L.forEach((l, k) => {
    let linha = [...document.querySelectorAll(".lv")].find(x => !$("#lv-p-" + x.dataset.i).value.trim() && !$("#lv-t-" + x.dataset.i).value.trim() && !x.dataset.cb);
    if (!linha) { Acoes["lv-add"](); linha = [...document.querySelectorAll(".lv")].pop(); }
    const i = linha.dataset.i, p = DB.produtos[l.c], t = $("#lv-t-" + i), bruto = r2(l.q * l.u), total = r2(bruto + partes[k]);
    $("#lv-p-" + i).value = l.c + " — " + p.n + " (" + uVenda(p) + ")";
    $("#lv-q-" + i).value = String(l.q);
    const u = $("#lv-u-" + i); setDinheiro(u, l.u || null); u.dataset.auto = "";
    setDinheiro(t, total); if (total !== bruto) t.dataset.sujo = "1"; else delete t.dataset.sujo;
    linha.dataset.cb = cb.n; linha.title = cb.n;
  });
  somaVenda(); bannerPosImpressao(false);
  aviso(cb.n + " lançado: " + C.L.length + " item(ns), " + brl(C.valor) + ".");
};

"use strict";

/* ===== Início do sistema ===== */
Banco.iniciar();
limparCotacoesVencidas();
dlg.addEventListener("close", () => { if (Est._sujo) { Est._sujo = false; atualizarTela(); } });
window.addEventListener("hashchange", () => { renderTela(); window.scrollTo(0, 0); });
renderTela();
