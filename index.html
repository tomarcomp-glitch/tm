<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d3b9e">
<title>Terreiro de Umbanda PAI JACÓ DE ARUANDA</title>
<style>
:root{color-scheme:light;--fundo:#f5f9ff;--papel:#ffffff;--texto:#0c1a3d;--suave:#4a5878;--linha:#d3ddef;--verde:#0d3b9e;--sobre:#ffffff;--ouro:#1566c9;--perigo:#a1352a;--ok:#25683f;--foco:#1566c9}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5rem}
h1{font-size:1.9rem}h2{font-size:1.3rem}
a{color:var(--verde)}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.topo{position:sticky;top:0;z-index:5;background:var(--papel);border-bottom:1px solid var(--linha);display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 1rem;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:.65rem;font:700 1.05rem/1.2 Georgia,serif;color:var(--texto);text-decoration:none}
.logo{width:44px;height:44px;border-radius:50%;object-fit:contain;background:#fff;flex:none}
.logo-g{width:132px;height:auto;border-radius:12px;background:#fff;padding:4px;flex:none}
nav{display:flex;gap:.25rem;align-items:center}
nav a,nav .link{padding:.5rem .75rem;border-radius:6px;color:var(--texto);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
nav a[aria-current]{background:var(--verde);color:var(--sobre)}
.link{background:none;border:0;font:inherit;cursor:pointer;color:var(--verde);padding:0;text-decoration:underline}
nav .link{text-decoration:none;color:var(--texto)}
.menu-btn{display:none}
@media(max-width:720px){.menu-btn{display:inline-block}nav{display:none;width:100%;flex-direction:column;align-items:stretch}nav.aberto{display:flex}}
main{max-width:980px;margin:0 auto;padding:1.25rem 1rem 3rem;outline:none}
.btn{background:var(--verde);color:var(--sobre);border:1px solid var(--verde);border-radius:6px;padding:.6rem 1rem;font:inherit;font-weight:600;cursor:pointer;min-height:40px}
.btn.sec{background:transparent;color:var(--texto);border-color:var(--linha)}
.btn.perigo{background:transparent;color:var(--perigo);border-color:var(--perigo)}
.btn.peq{padding:.3rem .6rem;min-height:34px;font-weight:500}
.btn:disabled{opacity:.6;cursor:wait}
.hero{display:flex;align-items:center;gap:1rem;padding:1.25rem 0 1rem;border-bottom:2px solid var(--ouro);margin-bottom:1.5rem}
.hero p{margin:0;color:var(--suave)}
.duas{display:grid;grid-template-columns:2fr 1fr;gap:2rem}
@media(max-width:760px){.duas{grid-template-columns:1fr}}
.noticia{padding:1rem 0;border-bottom:1px solid var(--linha)}
.noticia:first-of-type{padding-top:0}
.noticia time,.suave{color:var(--suave);font-size:.9rem}
.evento{display:flex;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--linha)}
.evento .dia{min-width:3.2rem;text-align:center;font-family:Georgia,serif;line-height:1.1}
.evento .dia b{display:block;font-size:1.5rem;color:var(--ouro)}
.vazio{color:var(--suave);padding:1rem 0}
.aviso-pend{background:var(--papel);border:1px solid var(--ouro);border-left-width:5px;padding:.8rem 1rem;margin-bottom:1.25rem;border-radius:6px}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:8px;padding:1.25rem}
.estreito{max-width:420px;margin:1rem auto}
label{display:block;font-weight:600;margin:.8rem 0 .25rem}
input,select,textarea{width:100%;font:inherit;color:var(--texto);background:var(--fundo);border:1px solid var(--linha);border-radius:6px;padding:.55rem .65rem;min-height:40px}
textarea{min-height:130px;resize:vertical}
label.chk{display:flex;gap:.5rem;align-items:center;font-weight:500}
label.chk input{width:auto;min-height:0}
.erro{color:var(--perigo);margin:.6rem 0 0;min-height:1.2em}
.certo{color:var(--ok)}
.abas{display:flex;gap:.25rem;flex-wrap:wrap;border-bottom:1px solid var(--linha);margin-bottom:1rem}
.abas a{padding:.5rem .8rem;text-decoration:none;color:var(--texto);border-bottom:3px solid transparent}
.abas a[aria-current]{border-color:var(--ouro);font-weight:700}
.cab{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}
.filtros{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.filtros input{flex:1;min-width:160px;width:auto}
.rolagem{overflow-x:auto;border:1px solid var(--linha);border-radius:8px;background:var(--papel)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:.6rem .75rem;text-align:left;border-bottom:1px solid var(--linha);vertical-align:top}
th{font-size:.85rem;color:var(--suave);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.acoes{white-space:nowrap;text-align:right}
td.ok,td.rec{color:var(--ok);font-weight:600}
td.neg,td.des,tr.alerta td.sit{color:var(--perigo);font-weight:600}
td.rasc{color:var(--suave)}
tr.alerta{background:color-mix(in srgb,var(--perigo) 8%,transparent)}
.totais{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:.8rem}
.totais div{background:var(--papel);border:1px solid var(--linha);border-radius:8px;padding:.6rem .8rem}
.totais span{display:block;font-size:.85rem;color:var(--suave)}
.totais strong{font-size:1.15rem;font-variant-numeric:tabular-nums}
strong.ok{color:var(--ok)}strong.neg{color:var(--perigo)}
dialog{border:1px solid var(--linha);border-radius:10px;background:var(--papel);color:var(--texto);width:min(520px,calc(100% - 1.5rem));padding:1.25rem;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.rodape{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem}
#aviso{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--texto);color:var(--fundo);padding:.6rem 1rem;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
#aviso.v{opacity:1}#aviso.e{background:var(--perigo);color:#fff}
@media(prefers-reduced-motion:reduce){#aviso{transition:none}}
.img-n{display:block;max-width:100%;max-height:360px;border-radius:8px;margin:.5rem 0}
.img-e{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:6px;margin:.4rem 0}
.prev{display:block;max-width:100%;max-height:160px;border-radius:6px;margin:.4rem 0}
.acoes-n{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.acoes-n .btn{padding:.4rem .85rem}
.btn[aria-pressed=true]{border-color:var(--ouro);color:var(--ouro);font-weight:700}
.presenca{margin-top:.6rem;padding:.6rem .7rem;border:1px solid var(--linha);border-radius:8px;background:var(--fundo)}
.presenca .pr-linha{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.presenca .pr-motivo{margin-top:.4rem}
.presenca .pr-motivo input{margin-bottom:.4rem}
.presenca .pr-msg{margin:.4rem 0 0;font-size:.9rem}
.pr-pend{color:var(--perigo);font-weight:600}
.alerta-pres{background:var(--papel);border:1px solid var(--perigo);border-left-width:5px;border-radius:6px;padding:.7rem 1rem;margin-bottom:1rem}
.lista-pres h3{font-size:1rem;margin:.9rem 0 .2rem}
.lista-pres ul{margin:0;padding-left:1.1rem}
.ajuda{background:var(--fundo);border-left:3px solid var(--ouro);padding:.5rem .7rem;margin:.4rem 0;font-size:.9rem;color:var(--suave);border-radius:4px}
.sec-m{border:1px solid var(--linha);border-radius:8px;padding:.1rem .8rem .8rem;margin-top:.8rem}
.sec-m h3{font-size:1rem;margin:.8rem 0 .2rem}
label.op{align-items:flex-start;margin:.5rem 0}
label.op input{margin-top:.3rem}
label.op span{display:flex;flex-direction:column}
label.op small{font-weight:400;color:var(--suave);line-height:1.35}
.lista-m{list-style:none;margin:.6rem 0 0;padding:0}
.lista-m li{padding:.6rem 0;border-bottom:1px solid var(--linha)}
.lista-m .pr-linha{display:flex;gap:.4rem;margin-top:.3rem}
.lista-m .pr-motivo{margin-top:.4rem;display:flex;gap:.4rem}
.lista-m .pr-motivo[hidden]{display:none}
.t-rec{color:var(--ok);font-weight:600}.t-des{color:var(--perigo);font-weight:600}
.dsem{display:block;font-size:.85rem;color:var(--suave);margin-top:.2rem}.filtros .dsem{display:inline;margin:0}
@media print{.topo,.btn,.filtros,.abas,.acoes{display:none!important}}
.topo{background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--linha);box-shadow:0 2px 10px rgba(13,59,158,.06)}
.hero{position:relative;border-bottom:1px solid var(--linha)!important;margin-bottom:2rem}
h1,h2{color:var(--verde)}
@media print{.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:420px}.cal b{text-align:center;font-size:.8rem;color:var(--suave)}
.cd{position:relative;min-height:44px;border:1px solid var(--linha);background:var(--papel);border-radius:6px;font:inherit;cursor:pointer;color:var(--texto);padding:0}
.cd.hj{border-color:var(--verde);font-weight:700}.cd.fase{background:#e6efff;border-color:var(--ouro)}.cd.sel{background:var(--verde);color:var(--sobre)}
.cd .lua{position:absolute;right:2px;top:0;font-size:.8rem}
.cal-cab{display:flex;align-items:center;justify-content:space-between;max-width:420px;margin:.5rem 0}
.hora{display:flex;gap:.5rem;align-items:center;margin:.5rem 0}.hora select{width:auto}
#faixa{max-width:980px;margin:0 auto;padding:0 1rem}.faixa-i{background:#e6efff;border:1px solid var(--ouro);border-radius:6px;padding:.6rem .8rem;margin-top:.6rem;font-weight:600}
.chk{display:flex;gap:.5rem;align-items:center;margin:.25rem 0}fieldset.ent{border:1px solid var(--linha);border-radius:6px;margin:.6rem 0;padding:.5rem .8rem}
#fichaImp{display:none}
@media print{body.imp-ficha :is(header,nav,footer,#faixa,.nao-imp){display:none!important}body.imp-ficha #fichaImp{display:block}}
#vcBanner:not(:empty){position:sticky;top:0;z-index:60;background:#fff3cd;border-bottom:2px solid var(--ouro);padding:.5rem 1rem;display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap}
</style>
</head>

  function calcular(entrada, opcoes) {
    opcoes = opcoes || {};

    var fuso = opcoes.fuso || FUSO_PADRAO;
    if (virada !== 'HORA' && virada !== 'DIA') throw new Error('virada deve ser HORA ou DIA');

    var ano = entrada.ano, mes = entrada.mes, dia = entrada.dia;
    var hora = entrada.hora, min = entrada.minuto;

    var referenciaMs = virada === 'HORA' ? nascimentoMs : localParaUTC(ano, mes, dia, 23, 59, 59, fuso);

    var signo = SIGNOS[idx];

    var inicioMs = instanteInicioSigno(referenciaMs, idx);

      signoAscendente: signoAsc,

      inicioDoSigno: ini.ano + '-' + String(ini.mes).padStart(2, '0') + '-' + String(ini.dia).padStart(2, '0'),
      virada: virada
    };
  }

    tabelas: { SIGNOS: SIGNOS, DECANATOS: DECANATOS, HORAS: HORAS, GUARDIOES: GUARDIOES }

function comprimir(file, max = 1280, q = 0.8) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const f = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * f), h = Math.round(img.height * f);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Não foi possível processar a imagem.')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Arquivo de imagem inválido.')); };
    img.src = url;
  });
}

    ? '<div class="aviso-pend">Seu cadastro foi recebido e aguarda a aprovação do administrador. Não é preciso criar outra conta: basta aguardar.</div>' : '';
  const noticias = n.error ? `<p class="erro">${esc(msgErro(n.error))}</p>`
    : !n.data.length ? '<p class="vazio">Nenhuma notícia publicada ainda.</p>'
    : n.data.map(x => cartaoNoticia(x, curtidas)).join('');
  const eventos = e.error ? `<p class="erro">${esc(msgErro(e.error))}</p>`
    : !e.data.length ? '<p class="vazio">Nenhum evento agendado.</p>'
    : e.data.map(x => blocoEvento(x, presencas)).join('');

async function minhasPresencas() {
  if (!sessao || !perfil || !meuCad()) return new Map();
  if (perfil.papel === 'consulente') { const r = await sb.rpc('incorporantes_confirmados'); INCORP = r.error ? [] : (r.data || []); }
  const {data} = await sb.from('presencas').select('evento_id,vai,motivo,medium_id,astral').eq('membro_id', meuCad());
  return new Map((data || []).map(x => [x.evento_id, x]));
}

const msgPresenca = r => !r ? 'Você ainda não respondeu.' : r.vai ? 'Presença confirmada.' : 'Registrado: você não irá.';

function widgetPresenca(x, resp) {
  if (!x.pede_presenca || !sessao || !perfil || !meuCad() || !resp) return '';
  const r = resp.get(x.id);
  return `<div class="presenca">${perfil.papel === 'consulente' ? `<label for="med_${x.id}">Médium que vai atender você *</label><select id="med_${x.id}" data-acao="medium"><option value="">Escolha o médium…</option><option value="astral"${r && r.astral ? ' selected' : ''}>Deixar o astral decidir</option>${INCORP.filter(i => i.evento_id === x.id).map(i => `<option value="${i.id}"${r && r.medium_id === i.id ? ' selected' : ''}>${esc(i.nome)}</option>`).join('')}</select>` : ''}<div class="pr-linha"><strong>Sua presença:</strong>
    <button class="btn sec peq" data-acao="irei" data-id="${x.id}" aria-pressed="${!!(r && r.vai)}">Irei</button>
    ${perfil.papel === 'consulente' ? `<button class="btn sec peq" data-acao="desmarcar" data-id="${x.id}"${r && r.vai ? '' : ' hidden'}>Desmarcar presença</button>` : `<button class="btn sec peq" data-acao="naoirei" data-id="${x.id}" aria-pressed="${!!(r && !r.vai)}">Não irei</button>`}</div>
    <div class="pr-motivo"${perfil.papel !== 'consulente' && r && !r.vai ? '' : ' hidden'}><label for="mot_${x.id}">Motivo (obrigatório)</label><input id="mot_${x.id}" maxlength="200" value="${esc(r && !r.vai ? r.motivo : '')}"><button class="btn peq" data-acao="salvar-motivo" data-id="${x.id}">Salvar motivo</button></div>
    <p class="pr-msg ${r ? 'suave' : 'pr-pend'}">${perfil.papel === 'consulente' ? (r && r.vai ? 'Presença confirmada.' : 'Escolha o médium e toque em Irei para confirmar.') : msgPresenca(r)}</p></div>`;
}

async function salvarPresenca(id, vai, motivo, wrap) {
  if (!sessao || !perfil || !meuCad()) return;
  const sm = wrap.querySelector('select[data-acao=medium]');
  if (vai && sm && !sm.value) { aviso('Escolha um médium ou "Deixar o astral decidir".', true); return; }
  const botoes = wrap.querySelectorAll('button');
  botoes.forEach(b => { b.disabled = true; });
  const {error} = await sb.from('presencas').upsert(
    {evento_id: id, membro_id: meuCad(), vai, motivo: vai ? null : motivo, ...(sm ? {medium_id: vai && sm.value && sm.value !== 'astral' ? Number(sm.value) : null, astral: !!(vai && sm.value === 'astral')} : {}), atualizado_em: new Date().toISOString()},
    {onConflict: 'evento_id,membro_id'});
  botoes.forEach(b => { b.disabled = false; });
  if (error) { aviso(msgErro(error), true); return; }
  wrap.querySelector('[data-acao=irei]').setAttribute('aria-pressed', String(vai));
  const ni = wrap.querySelector('[data-acao=naoirei]'), dm = wrap.querySelector('[data-acao=desmarcar]');
  if (ni) ni.setAttribute('aria-pressed', String(!vai));
  if (dm) dm.hidden = !vai;
  wrap.querySelector('.pr-motivo').hidden = vai || perfil.papel === 'consulente';
  const m = wrap.querySelector('.pr-msg');
  m.textContent = perfil.papel === 'consulente' ? (vai ? 'Presença confirmada.' : 'Presença desmarcada.') : msgPresenca({vai, motivo}); m.className = 'pr-msg suave';
  aviso('Resposta registrada.');
}

async function resumoPresencas() {
  const [ev, mm, pr] = await Promise.all([
    sb.from('eventos').select('id,titulo,data_hora').eq('pede_presenca', true).gte('data_hora', new Date().toISOString()).order('data_hora'),
    sb.from('membros').select('id,nome,usuario_id,tipo').in('tipo', ['medium', 'consulente']).order('nome'),
    sb.from('presencas').select('evento_id,membro_id,vai,motivo')
  ]);
  if (ev.error || mm.error || pr.error) return null;
  const porEvento = {}, pendentes = new Set();
  ev.data.forEach(e => {
    const resp = {};
    pr.data.filter(x => x.evento_id === e.id).forEach(x => { resp[x.membro_id] = x; });
    const linhas = mm.data.filter(m => m.tipo === 'medium' || resp[m.id]).map(m => ({id: m.id, nome: m.nome + (m.tipo === 'consulente' ? ' (consulente)' : ''), semConta: !m.usuario_id, vai: resp[m.id] ? resp[m.id].vai : null, motivo: resp[m.id] ? resp[m.id].motivo : null}));
    const sem = linhas.filter(l => l.vai === null);
    sem.forEach(l => pendentes.add(l.id));
    porEvento[e.id] = {linhas, irao: linhas.filter(l => l.vai === true), nao: linhas.filter(l => l.vai === false), sem};
  });
  return {porEvento, membrosPendentes: pendentes.size, eventosComPendencia: Object.values(porEvento).filter(x => x.sem.length).length};
}

async function preencherAlerta() {
  if (!perfil || perfil.papel !== 'admin') return;
  const r = await resumoPresencas();
  const el = $('#alertaPres');
  if (!el) return;
  const nm = await sb.from('mensagens').select('id', {count: 'exact', head: true}).eq('lida', false);
  let msgs = !nm.error && nm.count ? `<div class="alerta-pres" role="alert"><strong>Mensagens novas:</strong> ${nm.count} de médiuns. <a href="#/admin/mensagens">Ler</a></div>` : '';
  const nc = await sb.from('contribuicoes_info').select('id', {count: 'exact', head: true}).eq('status', 'pendente');
  if (!nc.error && nc.count) msgs += `<div class="alerta-pres" role="alert"><strong>Contribuições a confirmar:</strong> ${nc.count}. <a href="#/admin/contribuicoes">Ver</a></div>`;
  if (!r || !r.eventosComPendencia) { el.innerHTML = msgs; return; }
  el.innerHTML = msgs + `<div class="alerta-pres" role="alert"><strong>Presenças sem resposta:</strong> ${r.membrosPendentes} membro(s) ainda não decidiram em ${r.eventosComPendencia} evento(s). <a href="#/admin/eventos">Ver respostas</a></div>`;
}

async function abrirRespostas(ev, aoMudar) {
  const d = $('#dlg');
  let mudou = false;
  d.innerHTML = `<h2 id="dlgT">Presenças: ${esc(ev.titulo)}</h2><div id="corpoPres"><p class="vazio">Carregando…</p></div><div class="rodape"><button class="btn" id="fechar" type="button">Fechar</button></div>`;
  d.showModal();
  $('#fechar').onclick = () => d.close();
  d.onclose = () => { d.onclick = null; d.onclose = null; if (mudou && aoMudar) aoMudar(); };
  const status = l => l.vai === null ? 'sem resposta' : l.vai ? 'irá' : 'não irá — ' + l.motivo;
  const desenhar = async () => {
    const r = await resumoPresencas(), x = r && r.porEvento[ev.id], c = $('#corpoPres');
    if (!c) return;
    if (!x) { c.innerHTML = '<p class="suave">Este evento não pede confirmação de presença ou já aconteceu.</p>'; return; }
    if (!x.linhas.length) { c.innerHTML = '<p class="suave">Nenhum médium cadastrado ainda.</p>'; return; }
    c.innerHTML = `<p class="suave">Irão ${x.irao.length} · Não irão ${x.nao.length} · Sem resposta ${x.sem.length}. Quem não tem conta no site não consegue responder: registre por essa pessoa aqui.</p><ul class="lista-m">`
      + [...x.sem, ...x.nao, ...x.irao].map(l => `<li data-m="${l.id}"><div><strong>${esc(l.nome)}</strong>${l.semConta ? ' <span class="suave">(sem conta)</span>' : ''}<br><span class="${l.vai === null ? 'pr-pend' : 'suave'}">${esc(status(l))}</span></div>
        <div class="pr-linha"><button class="btn sec peq" data-r="sim" aria-pressed="${l.vai === true}">Irá</button><button class="btn sec peq" data-r="nao" aria-pressed="${l.vai === false}">Não irá</button></div>
        <div class="pr-motivo" hidden><input maxlength="200" placeholder="Motivo (obrigatório)" aria-label="Motivo"><button class="btn peq" data-r="salvar">Salvar</button></div></li>`).join('') + '</ul>';
  };
  d.onclick = async e => {
    const b = e.target.closest('button[data-r]'); if (!b) return;
    const li = b.closest('li'), mid = Number(li.dataset.m);
    if (b.dataset.r === 'nao') { li.querySelector('.pr-motivo').hidden = false; li.querySelector('input').focus(); return; }
    let vai = b.dataset.r === 'sim', motivo = null;
    if (b.dataset.r === 'salvar') {
      motivo = li.querySelector('input').value.trim();
      if (!motivo) { aviso('Informe o motivo.', true); return; }
      vai = false;
    }
    const {error} = await sb.from('presencas').upsert({evento_id: ev.id, membro_id: mid, vai, motivo, atualizado_em: new Date().toISOString()}, {onConflict: 'evento_id,membro_id'});
    if (error) { aviso(msgErro(error), true); return; }
    mudou = true; aviso('Resposta registrada.'); desenhar();
  };
  desenhar();
}

function blocoEvento(x, resp) {
  EVC[x.id] = x;
  const d = new Date(x.data_hora);
  const mes = d.toLocaleDateString('pt-BR', {month:'short'}).replace('.', '');
  return `<div class="evento"><div class="dia"><b>${d.getDate()}</b>${esc(mes)}</div><div><strong>${esc(x.titulo)}</strong>${x.publico ? '' : ' <span class="suave">(só membros)</span>'}<br><span class="suave">${SEM[d.getDay()]}, ${d.toLocaleDateString('pt-BR')} às ${_hm(d)}${x.local ? ' · ' + esc(x.local) : ''}</span>${imgTag(x.imagem_path, 'img-e')}${x.descricao ? '<br>' + texto(x.descricao) : ''}<div class="acoes-n" style="margin-top:.5rem"><button class="btn sec peq" type="button" data-acao="copiar-evento" data-id="${x.id}">Compartilhar evento</button> <button class="btn sec peq" type="button" data-acao="zap-evento" data-id="${x.id}">WhatsApp</button></div>${widgetPresenca(x, resp)}</div></div>`;
}

async function viewAgenda() {
  app.innerHTML = '<h1>Agenda</h1><p class="vazio">Carregando…</p>';
  const {data, error} = await sb.from('eventos').select('*').gte('data_hora', new Date().toISOString()).order('data_hora');
  const presencas = await minhasPresencas();
  const corpo = error ? `<p class="erro">${esc(msgErro(error))}</p>`
    : !data.length ? '<p class="vazio">Nenhum evento agendado por enquanto.</p>'
    : data.map(x => blocoEvento(x, presencas)).join('');
  const dica = sessao ? '' : '<p class="suave">Entre com sua conta de membro para ver também os eventos internos.</p>';
  app.innerHTML = `<h1>Agenda</h1>${dica}${corpo}`;
}

function viewEntrar() {
  app.innerHTML = `<div class="cartao estreito"><h1 id="tit">Entrar</h1>
    <form id="frmL" novalidate>
      <div id="campoNome" hidden><label for="nome">Seu nome</label><input id="nome" autocomplete="name"></div>
      <label for="email" id="lblEmail">E-mail ou usuário</label><input id="email" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email">
      <label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password">
      <p class="erro" id="erroL" role="alert"></p>
      <button class="btn" id="env" style="width:100%;margin-top:.6rem">Entrar</button>
    </form>
    <p class="suave"><span id="txtAlt">Ainda não tem cadastro?</span> <button class="link" id="alt" type="button">Criar conta</button></p></div>`;
  let cadastro = false;
  const msg = (t, ok) => { const p = $('#erroL'); p.textContent = t; p.className = 'erro' + (ok ? ' certo' : ''); };
  $('#alt').onclick = () => {
    cadastro = !cadastro; msg('');
    $('#tit').textContent = cadastro ? 'Criar conta' : 'Entrar';
    $('#env').textContent = cadastro ? 'Criar conta' : 'Entrar';
    $('#txtAlt').textContent = cadastro ? 'Já tem cadastro?' : 'Ainda não tem cadastro?';
    $('#alt').textContent = cadastro ? 'Entrar' : 'Criar conta';
    $('#campoNome').hidden = !cadastro;
    $('#lblEmail').textContent = cadastro ? 'E-mail' : 'E-mail ou usuário';
    $('#senha').autocomplete = cadastro ? 'new-password' : 'current-password';
  };
  $('#frmL').onsubmit = async ev => {
    ev.preventDefault();
    const entrada = $('#email').value.trim(), senha = $('#senha').value, nome = $('#nome').value.trim();
    const email = (!cadastro && entrada && !entrada.includes('@')) ? loginParaEmail(entrada) : entrada;
    if (cadastro && !nome) { msg('Informe seu nome.'); $('#nome').focus(); return; }
    if (!entrada || !email) { msg(cadastro ? 'Informe seu e-mail.' : 'Informe seu e-mail ou usuário.'); $('#email').focus(); return; }
    if (cadastro && !entrada.includes('@')) { msg('Informe um e-mail válido.'); $('#email').focus(); return; }
    if (senha.length < 6) { msg('A senha precisa ter pelo menos 6 caracteres.'); $('#senha').focus(); return; }
    const btn = $('#env'); btn.disabled = true; msg('');
    if (cadastro) {
      const {data, error} = await sb.auth.signUp({email, password: senha, options: {data: {nome}}});
      btn.disabled = false;
      if (error) { msg(msgErro(error)); return; }
      if (data.session) { location.hash = '#/'; return; }
      msg('Cadastro criado. Enviamos um link de confirmação para o seu e-mail. Confirme e depois entre. O acesso só é liberado após a aprovação do administrador: não crie outra conta.', true);
    } else {
      const {error} = await sb.auth.signInWithPassword({email, password: senha});
      btn.disabled = false;
      if (error) { msg(msgErro(error)); return; }
      location.hash = '#/';
    }
  };
  $('#email').focus();
}

      {r:'Quantidade', num:true, fmt:r => `${r.quantidade ?? 0} ${r.unidade || ''}`.trim()},
      {r:'Mínimo', num:true, fmt:r => String(r.minimo ?? 0)},
      {r:'Situação', fmt:r => (Number(r.minimo) > 0 && Number(r.quantidade) <= Number(r.minimo)) ? 'Repor' : 'Ok', cls:() => 'sit'}
    ],
    campos:[
      {k:'item', r:'Item', tipo:'text', req:true},
      {k:'quantidade', r:'Quantidade em estoque', tipo:'number', padrao:0, min:0},
      {k:'unidade', r:'Unidade (ex.: un, kg, maço)', tipo:'text'},
      {k:'minimo', r:'Quantidade mínima (avisa para repor)', tipo:'number', padrao:0, min:0}
    ]
  }
};

async function abrirForm(cfg, row, aoSalvar) {
  const novo = !row, r = row || {};
  const ops = {};
  for (const c of cfg.campos) if (c.tipo === 'select') ops[c.k] = typeof c.opcoes === 'function' ? await c.opcoes() : c.opcoes;
  const campo = c => {
    if (c.virtual && !novo) return '';
    const pad = typeof c.padrao === 'function' ? c.padrao() : c.padrao;
    const v = novo ? pad : r[c.k];
    const id = 'f_' + c.k;
    if (c.tipo === 'checkbox') return `<label class="chk"><input type="checkbox" id="${id}"${v ? ' checked' : ''}>${esc(c.r)}</label>`;
    if (c.tipo === 'imagem') {
      const atual = r[c.k] ? `<img class="prev" src="${esc(imgUrl(r[c.k]))}" alt="Imagem atual">` : '';
      const apaga = c.pasta === 'eventos' ? 'o evento termina ou é excluído' : 'a notícia é excluída';
      return `<label for="${id}">${esc(c.r)}</label>${atual}<input id="${id}" type="file" accept="image/*">${r[c.k] ? `<label class="chk"><input type="checkbox" id="${id}_rm">Remover a imagem atual</label>` : ''}<p class="suave">A imagem é reduzida automaticamente e apagada quando ${apaga}.</p>`;
    }
    const rot = `<label for="${id}">${esc(c.r)}${c.req ? ' *' : ''}</label>`;
    if (c.tipo === 'textarea') return `${rot}<textarea id="${id}">${esc(v ?? '')}</textarea>`;
    if (c.tipo === 'select') return `${rot}<select id="${id}">${c.req ? '' : '<option value=""></option>'}${ops[c.k].map(o => `<option value="${esc(o.v)}"${String(o.v) === String(v ?? '') ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`;
    if (c.tipo === 'datetime') return `${rot}<input id="${id}" type="hidden" value="${esc(paraLocal(v))}"><div class="seldata" data-alvo="${id}"></div>`;
    const tipo = c.tipo;
    const val = v ?? '';
    const extra = c.tipo === 'number' ? ' step="any" inputmode="decimal"' + (c.min !== undefined ? ` min="${c.min}"` : '') : '';
    return `${rot}<input id="${id}" type="${tipo}" value="${esc(val)}"${extra}>`;
  };
  const d = $('#dlg');
  d.innerHTML = `<form id="frm" novalidate><h2 id="dlgT">${novo ? esc(cfg.botao) : 'Editar ' + esc(cfg.singular)}</h2>${cfg.campos.map(campo).join('')}<p class="erro" id="erroF" role="alert"></p><div class="rodape"><button type="button" class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="salvar">Salvar ${esc(cfg.singular)}</button></div></form>`;
  d.showModal();
  d.querySelectorAll('.seldata').forEach(montarSelData);
  const primeiro = d.querySelector('input:not([type=hidden]),textarea,select'); if (primeiro) primeiro.focus();
  $('#cancelar').onclick = () => d.close();
  const erro = t => { $('#erroF').textContent = t; };
  $('#frm').onsubmit = async ev => {
    ev.preventDefault();
    const obj = {};
    let arquivo = null, rep = 0;
    for (const c of cfg.campos) {
      const el = $('#f_' + c.k);
      if (c.virtual) { rep = el ? Math.min(52, Math.max(0, parseInt(el.value, 10) || 0)) : 0; continue; }
      if (c.tipo === 'imagem') {
        const rm = $('#f_' + c.k + '_rm');
        if (el.files && el.files[0]) arquivo = el.files[0];
        else if (rm && rm.checked) obj[c.k] = null;
        continue;
      }
      if (c.tipo === 'checkbox') { obj[c.k] = el.checked; continue; }
      let v = el.value.trim();
      if (!v) {
        if (c.req) { erro(`Preencha o campo "${c.r}".`); el.focus(); return; }
        obj[c.k] = null; continue;
      }
      if (c.tipo === 'number') {
        v = Number(v);
        if (isNaN(v) || (c.min !== undefined && v < c.min)) { erro(`Valor inválido em "${c.r}".`); el.focus(); return; }
      } else if (c.tipo === 'datetime') {
        v = new Date(v).toISOString();
      } else if (c.int) {
        v = Number(v);
      }
      obj[c.k] = v;
    }
    const btn = $('#salvar'); btn.disabled = true; erro('');
    const ci = cfg.campos.find(c => c.tipo === 'imagem');
    let enviada = null, antiga = null;
    if (ci && arquivo) {
      try { enviada = await enviarImagem(arquivo, ci.pasta); }
      catch (e) { erro(msgErro(e)); btn.disabled = false; return; }
      obj[ci.k] = enviada;
    }
    if (ci && !novo && r[ci.k] && (enviada || obj[ci.k] === null)) antiga = r[ci.k];
    const res = novo
      ? await sb.from(cfg.tabela).insert({...obj, ...(cfg.extraNovo ? cfg.extraNovo() : {})}).select()
      : await sb.from(cfg.tabela).update(obj).eq('id', r.id).select();
    if (res.error || !res.data || !res.data.length) {
      if (enviada) await apagarImagens([enviada]);
      erro(res.error ? msgErro(res.error) : 'Não foi possível salvar. Verifique se você ainda está logado como administrador.');
      btn.disabled = false; return;
    }
    if (antiga) await apagarImagens([antiga]);
    if (novo && rep > 0 && cfg.tabela === 'eventos') {
      const copias = Array.from({length: rep}, (_, i) => { const dt = new Date(obj.data_hora); dt.setDate(dt.getDate() + 7 * (i + 1)); return {...obj, data_hora: dt.toISOString(), imagem_path: null}; });
      const rc = await sb.from('eventos').insert(copias);
      if (rc.error) aviso('O evento foi salvo, mas as repetições falharam: ' + msgErro(rc.error), true);
    }
    d.close(); aviso('Salvo.'); aoSalvar();
  };
}

  let linhas = [], ctx = {};

      + rs.map(r => `<tr class="${cfg.destaque && cfg.destaque(r) ? 'alerta' : ''}">`
        + cfg.colunas.map(c => `<td class="${c.num ? 'num ' : ''}${c.cls ? c.cls(r, ctx) : ''}">${esc(c.fmt(r, ctx))}</td>`).join('')
        + `<td class="acoes">${cfg.movimento ? `<button class="btn sec peq" data-a="ent" data-id="${r.id}">Entrada</button> <button class="btn sec peq" data-a="sai" data-id="${r.id}">Saída</button> ` : ''}${cfg.respostas ? `<button class="btn sec peq" data-a="r" data-id="${r.id}">Respostas</button> ` : ''}<button class="btn sec peq" data-a="e" data-id="${r.id}">Editar</button> <button class="btn perigo peq" data-a="x" data-id="${r.id}">Excluir</button></td></tr>`).join('')
      + '</tbody></table></div>';
  };
  const carregar = async () => {
    if (cfg.antes) ctx = await cfg.antes();
    const {data, error} = await sb.from(cfg.tabela).select('*').order(cfg.ordem[0], {ascending:cfg.ordem[1]});
    if (error) { $('#lista').innerHTML = `<p class="erro">${esc(msgErro(error))}</p>`; return; }
    linhas = data; desenhar();
  };
  $('#novo').onclick = () => abrirForm(cfg, null, carregar);
  $('#busca').oninput = desenhar;
  if (cfg.filtroMes) $('#mes').oninput = desenhar;
  $('#lista').onclick = async ev => {
    const b = ev.target.closest('button[data-a]'); if (!b) return;
    const row = linhas.find(x => String(x.id) === b.dataset.id); if (!row) return;
    if (b.dataset.a === 'ent' || b.dataset.a === 'sai') { abrirMov(row, b.dataset.a === 'ent' ? 'entrada' : 'saida', carregar); return; }
    if (b.dataset.a === 'r') { abrirRespostas(row, carregar); return; }
    if (b.dataset.a === 'e') { abrirForm(cfg, row, carregar); return; }
    if (!(await confirmar(`Excluir "${cfg.nome(row)}"? Esta ação não pode ser desfeita.`, 'Excluir ' + cfg.singular))) return;
    const {data, error} = await sb.from(cfg.tabela).delete().eq('id', row.id).select();
    if (error || !data || !data.length) { aviso(error ? msgErro(error) : 'Não foi possível excluir.', true); return; }
    if (row.imagem_path && !(await apagarImagens([row.imagem_path]))) aviso('Excluído, mas a imagem não pôde ser apagada do armazenamento.', true);
    else aviso('Excluído.');
    carregar();
  };
  carregar();
}

const ROTULO_ACESSO = {pendente:'aguardando', consulente:'consulente', membro:'médium', admin:'administrador'};

function resumoPessoa(m) {
  const T = TERMOS, rot = k => (T.funcoes[k] || T.cargos[k] || {r:k}).r;
  const f = (m.funcoes || []).map(rot);
  if (m.tipo === 'medium') return [...f, m.grau ? T.graus[m.grau].r : null].filter(Boolean).join(' · ');
  return f.join(' · ');
}

const FUSO_NASC = 'America/Sao_Paulo';

async function viradaCoroa() {
  const {data, error} = await sb.from('configuracoes').select('valor').eq('chave', 'coroa_virada').maybeSingle();
  return !error && data && data.valor === 'DIA' ? 'DIA' : 'HORA';
}

function calcularCoroa(nasc, hora, virada) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(nasc || ''), h = /^(\d{2}):(\d{2})/.exec(hora || '');
  if (!m || !h) return null;
  try {
    return CoroaCalculo.calcular({ano: +m[1], mes: +m[2], dia: +m[3], hora: +h[1], minuto: +h[2]}, {virada, fuso: FUSO_NASC});
  } catch (e) { return null; }
}

      <label class="chk op" id="coroaRecalcL" hidden><input type="checkbox" id="m_recalc"><span><strong>Recalcular agora</strong><small>O resultado gravado difere do cálculo com a regra atual. Marque e salve para atualizar a coroa deste médium.</small></span></label></div>

    <p class="ajuda">Ao vincular uma conta, o acesso dela ao site passa a seguir o tipo escolhido acima.</p>
    <p class="erro" id="erroF" role="alert"></p>
    <div class="rodape"><button type="button" class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="salvar">Salvar cadastro</button></div></form>`;
  const atualizar = () => {
    const t = $('#m_tipo').value, g = $('#m_grau').value;
    $('#exTipo').textContent = t ? T.tipos[t].d : 'Escolha o tipo de cadastro para ver as opções.';
    ['administrador', 'medium', 'consulente'].forEach(k => { $('#sec_' + k).hidden = k !== t; });
    $('#horaWrap').hidden = $('#coroaBloco').hidden = t !== 'medium';
    $('#exGrau').textContent = g ? T.graus[g].d : 'Escolha o grau para ver a explicação.';
  };
  $('#m_tipo').onchange = atualizar; $('#m_grau').onchange = atualizar; atualizar();
  const coroaEstado = () => {
    const nasc = $('#m_nasc').value, hora = $('#m_hora').value;
    const nova = calcularCoroa(nasc, hora, virada);
    const g = row && row.coroa_calculo;
    const mesma = !!(g && row.nascimento === nasc && String(row.hora_nascimento || '').slice(0, 5) === hora);
    const gravada = mesma ? g : null;
    const chaves = ['signo', 'decanato', 'nascimento', 'hora', 'ascendente', 'guardiao'];
    const difere = !!(gravada && nova && chaves.some(k => gravada[k] !== nova[k]));
    const usar = (gravada && !(difere && $('#m_recalc').checked)) ? gravada : nova;
    return {nova, gravada, difere, usar};
  };
  const desenharCoroa = () => {
    const el = $('#coroaTxt'), {nova, gravada, difere, usar} = coroaEstado();
    $('#coroaRecalcL').hidden = !difere;
    if (!usar) { el.innerHTML = '<p class="ajuda">Preencha a data e a hora de nascimento para calcular.</p>'; return; }
    const linhas = [['Signo', `${usar.signo} · ${usar.decanato}º decanato`], ['Orixá de nascimento', usar.nascimento], ['Orixá da hora', usar.hora], ['Orixá ascendente', usar.ascendente], ['Exu guardião', usar.guardiao]];
    let nota = '';
    if (usar === gravada) {
      nota = `Resultado gravado em ${dataBR(gravada.calculadoEm)} (virada de signo ${gravada.virada === 'DIA' ? 'pelo dia' : 'pela hora'}).`;
      if (difere) nota += ` Com a regra atual, seria: Orixá de nascimento ${nova.nascimento}, da hora ${nova.hora}, ascendente ${nova.ascendente}, guardião ${nova.guardiao}.`;
    } else nota = 'Será gravado ao salvar o cadastro.';
    el.innerHTML = `<div class="rolagem"><table><tbody>${linhas.map(([k, v]) => `<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div><p class="ajuda">${esc(nota)}</p>`;
  };
  ['m_nasc', 'm_hora', 'm_recalc'].forEach(i => { $('#' + i).addEventListener('input', desenharCoroa); $('#' + i).addEventListener('change', desenharCoroa); });
  desenharCoroa();
  d.showModal();
  $('#m_nome').focus();
  $('#cancelar').onclick = () => d.close();
  const erro = t => { $('#erroF').textContent = t; };
  $('#frm').onsubmit = async ev => {
    ev.preventDefault();
    const nome = $('#m_nome').value.trim(), tipo = $('#m_tipo').value;
    if (!nome) { erro('Preencha o nome.'); $('#m_nome').focus(); return; }
    if (!tipo) { erro('Escolha o tipo de cadastro.'); $('#m_tipo').focus(); return; }
    const marc = n => [...d.querySelectorAll(`input[name="${n}"]:checked`)].map(i => i.value);
    let funcoes = [], grau = null, acesso = false, perms = [];
    if (tipo === 'administrador') funcoes = marc('f_adm');
    if (tipo === 'medium') { funcoes = [...marc('f_med'), ...marc('f_cargo')]; grau = $('#m_grau').value ? Number($('#m_grau').value) : null; acesso = $('#m_acesso').checked; perms = [...document.querySelectorAll('.m_perm:checked')].map(x => x.value); }
    if (tipo === 'consulente') { funcoes = marc('f_con'); if (!funcoes.length) { erro('Escolha a função: contribuinte ou não contribuinte.'); return; } }
    const v = id => $(id).value.trim() || null;
    let coroa = null;
    if (tipo === 'medium') { const e = coroaEstado(); coroa = e.usar ? (e.usar === e.gravada ? e.gravada : {...e.usar, calculadoEm: new Date().toISOString()}) : null; }
    const obj = {nome, tipo, funcoes, grau, acesso_admin: acesso, permissoes: perms, telefone: v('#m_tel'), nascimento: v('#m_nasc'), hora_nascimento: tipo === 'medium' ? v('#m_hora') : null, coroa_calculo: coroa, data_entrada: v('#m_entr'), observacoes: v('#m_obs'), usuario_id: $('#m_conta').value || null};
    const btn = $('#salvar'); btn.disabled = true; erro('');
    const res = novo ? await sb.from('membros').insert(obj).select() : await sb.from('membros').update(obj).eq('id', row.id).select();
    if (res.error || !res.data || !res.data.length) { erro(res.error ? msgErro(res.error) : 'Não foi possível salvar.'); btn.disabled = false; return; }
    d.close(); aviso('Salvo.'); aoSalvar();
  };
}

function limparLogin(s) {
  const t = norm(s).trim().replace(/\s+/g, '');
  return t.includes('@') ? t : t.replace(/[^a-z0-9._-]/g, '');
}
function loginParaEmail(s) {
  const t = limparLogin(s);
  return !t ? '' : t.includes('@') ? t : t + '@' + CONFIG.dominioUsuario;
}
function loginExibicao(email) {
  const suf = '@' + CONFIG.dominioUsuario;
  return String(email || '').endsWith(suf) ? email.slice(0, -suf.length) : email;
}
function gerarSenha() {
  const alfa = 'abcdefghjkmnpqrstuvwxyz23456789', b = new Uint32Array(8);
  crypto.getRandomValues(b);
  return [...b].map(n => alfa[n % alfa.length]).join('');
}

function mostrarAcesso(d, titulo, nome, telefone, login, senha) {
  const url = location.href.split('#')[0];
  const texto = `${CONFIG.nome}\nAcesso ao site: ${url}\nUsuário: ${login}\nSenha: ${senha}`;
  let tel = String(telefone || '').replace(/\D/g, '');
  if (tel.length === 10 || tel.length === 11) tel = '55' + tel;
  d.innerHTML = `<form id="frm" novalidate><h2 id="dlgT">${esc(titulo)}</h2>
    <p class="suave">${esc(nome)}</p>
    <div class="ajuda"><strong>Usuário:</strong> ${esc(login)}<br><strong>Senha:</strong> ${esc(senha)}</div>
    <p class="suave">Anote ou envie agora: por segurança, a senha não fica visível depois. Se ela for esquecida, use "Nova senha" na lista.</p>
    <div class="rodape"><button type="button" class="btn sec" id="copiar">Copiar dados</button>${tel.length >= 12 ? `<a class="btn sec" target="_blank" rel="noopener" href="https://wa.me/${tel}?text=${encodeURIComponent(texto)}">Enviar pelo WhatsApp</a>` : ''}<button type="button" class="btn" id="fechar">Concluir</button></div></form>`;
  $('#copiar').onclick = async () => {
    try { await navigator.clipboard.writeText(texto); aviso('Dados copiados.'); } catch (e) { aviso('Não foi possível copiar. Anote os dados na tela.', true); }
  };
  $('#fechar').onclick = () => d.close();
}

function abrirCriarAcesso(row, aoSalvar) {
  const d = $('#dlg');
  d.onclick = null; d.onclose = null;
  const dig = String(row.telefone || '').replace(/\D/g, '');
  const sugestao = dig.length >= 8 ? dig : limparLogin(String(row.nome || '').split(' ')[0]);
  d.innerHTML = `<form id="frm" novalidate><h2 id="dlgT">Criar acesso</h2>
    <p class="suave">${esc(row.nome)}</p>
    <label for="a_login">Usuário *</label><input id="a_login" value="${esc(sugestao)}" autocomplete="off" autocapitalize="none" spellcheck="false">
    <p class="ajuda">Use letras sem acento, números, ponto, hífen ou sublinhado. Pode ser o telefone ou o primeiro nome. Se preferir, digite um e-mail.</p>
    <label for="a_senha">Senha * (mínimo 6 caracteres)</label>
    <div style="display:flex;gap:.5rem"><input id="a_senha" autocomplete="off" autocapitalize="none" spellcheck="false" style="flex:1"><button type="button" class="btn sec" id="a_gerar">Gerar senha</button></div>
    <p class="erro" id="erroF" role="alert"></p>
    <div class="rodape"><button type="button" class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="salvar">Criar acesso</button></div></form>`;
  d.showModal(); $('#a_login').focus();
  $('#cancelar').onclick = () => d.close();
  $('#a_gerar').onclick = () => { $('#a_senha').value = gerarSenha(); };
  const erro = t => { $('#erroF').textContent = t; };
  $('#frm').onsubmit = async ev => {
    ev.preventDefault();
    const login = limparLogin($('#a_login').value), senha = $('#a_senha').value;
    if (login.length < 3) { erro('Informe o usuário (mínimo 3 caracteres).'); $('#a_login').focus(); return; }
    if (login.includes('@') && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(login)) { erro('E-mail inválido.'); $('#a_login').focus(); return; }
    if (senha.length < 6) { erro('A senha precisa ter pelo menos 6 caracteres.'); $('#a_senha').focus(); return; }
    const btn = $('#salvar'); btn.disabled = true; erro('');
    const {data: novoId, error} = await sb.rpc('admin_criar_acesso', {p_login: loginParaEmail(login), p_senha: senha, p_nome: row.nome});
    if (error || !novoId) { erro(msgErro(error || 'Não foi possível criar o acesso.')); btn.disabled = false; return; }
    const v = await sb.from('membros').update({usuario_id: novoId}).eq('id', row.id).select();
    if (v.error || !v.data || !v.data.length) {
      erro('O acesso foi criado, mas não foi possível ligá-lo ao cadastro. Feche e use "Cadastrar" na lista de contas sem cadastro.');
      aoSalvar(); return;
    }
    aoSalvar();
    mostrarAcesso(d, 'Acesso criado', row.nome, row.telefone, loginExibicao(loginParaEmail(login)), senha);
  };
}

async function viewHistorico() {
  app.innerHTML = abas('#/admin/estoque') + sub(SUBEST, '#/admin/estoque/historico') + `<div class="cab"><h1>Histórico do estoque</h1><button class="btn sec" onclick="window.print()">Imprimir</button></div>
    <div class="filtros"><input id="busca" type="search" placeholder="Buscar item ou pessoa" aria-label="Buscar"><select id="ftp" aria-label="Tipo" style="max-width:170px"><option value="">Todos os tipos</option><option value="entrada">Entradas</option><option value="saida">Saídas</option><option value="inventario">Inventário</option></select><input id="mes" type="month" aria-label="Mês" style="max-width:170px"></div>
    <div id="lista"><p class="vazio">Carregando…</p></div>`;
  const {data, error} = await sb.from('estoque_mov').select('*').order('criado_em', {ascending: false}).limit(1000);
  if (error) { $('#lista').innerHTML = `<p class="erro">${esc(msgErro(error))}</p>`; return; }
  const desenhar = () => {
    const q = norm($('#busca').value), t = $('#ftp').value, m = $('#mes').value;
    const rs = data.filter(r => (!q || norm(r.item_nome).includes(q) || norm(r.pessoa_nome).includes(q)) && (!t || r.tipo === t) && (!m || isoD(new Date(r.criado_em)).startsWith(m)));
    if (!data.length) { $('#lista').innerHTML = '<p class="vazio">Nenhuma movimentação ainda. Use os botões Entrada e Saída na lista de itens.</p>'; return; }
    if (!rs.length) { $('#lista').innerHTML = '<p class="vazio">Nada encontrado com esse filtro.</p>'; return; }
    $('#lista').innerHTML = tbl(['Data e hora', 'Tipo', 'Item', 'Quantidade', 'Saldo', 'Quem entregou / retirou / contou', 'Registrado por', 'Observação'],
      rs.map(r => {
        const n = Number(r.quantidade), tp = TP_MOV[r.tipo] || [r.tipo, ''];
        const v = r.tipo === 'entrada' ? '+ ' + qtd(n) : r.tipo === 'saida' ? '− ' + qtd(n) : (n > 0 ? '+ ' : n < 0 ? '− ' : '') + qtd(Math.abs(n));
        return [dataHoraBR(r.criado_em), `<span class="${tp[1]}">${esc(tp[0])}</span>`, esc(r.item_nome), v, `${qtd(r.saldo_anterior)} → ${qtd(r.saldo_novo)}`, esc(r.pessoa_nome || ''), esc(r.por_nome || ''), esc(r.obs || '')];
      }), [3, 4]) + (data.length >= 1000 ? '<p class="suave">Mostrando as 1000 movimentações mais recentes.</p>' : '');
  };
  $('#busca').oninput = desenhar; $('#ftp').onchange = desenhar; $('#mes').oninput = desenhar;
  desenhar();
}

async function viewInventario() {
  app.innerHTML = abas('#/admin/estoque') + sub(SUBEST, '#/admin/estoque/inventario') + `<div class="cab"><h1>Inventário</h1><button class="btn sec" onclick="window.print()">Imprimir</button></div>
    <p class="suave">Conte o que há de fato e digite em "Contado". Itens em branco não mudam. Ao salvar, o estoque passa a ter a quantidade contada e cada item conferido fica registrado no histórico.</p><div id="lista"><p class="vazio">Carregando…</p></div>`;
  const {data, error} = await sb.from('estoque').select('*').order('item');
  if (error) { $('#lista').innerHTML = `<p class="erro">${esc(msgErro(error))}</p>`; return; }
  if (!data.length) { $('#lista').innerHTML = '<p class="vazio">Nenhum item no estoque. Cadastre os itens primeiro.</p>'; return; }
  $('#lista').innerHTML = tbl(['Item', 'No sistema', 'Contado'], data.map(r => [esc(r.item), `${qtd(r.quantidade)} ${esc(r.unidade || '')}`, `<input class="cnt" data-id="${r.id}" type="number" step="any" min="0" inputmode="decimal" aria-label="Contado: ${esc(r.item)}" style="max-width:130px">`]), [1])
    + `<label for="inv_p">Quem fez a contagem *</label><input id="inv_p" list="dlPes" maxlength="120" autocomplete="off">${await datalistPessoas()}
    <label for="inv_o">Observação</label><input id="inv_o" maxlength="200"><div class="rodape"><button class="btn" id="inv_s">Salvar inventário</button></div>`;
  $('#inv_s').onclick = async () => {
    const p = $('#inv_p').value.trim(), campos = [...document.querySelectorAll('input.cnt')].filter(i => i.value.trim() !== '');
    if (!campos.length) { aviso('Digite a quantidade contada em pelo menos um item.', true); return; }
    if (!p) { aviso('Informe quem fez a contagem.', true); $('#inv_p').focus(); return; }
    if (campos.some(i => isNaN(Number(i.value)) || Number(i.value) < 0)) { aviso('Há quantidade inválida na contagem.', true); return; }
    const b = $('#inv_s'); b.disabled = true;
    let ok = 0;
    for (const i of campos) {
      const {error: e} = await sb.rpc('estoque_movimentar', {p_item: Number(i.dataset.id), p_tipo: 'inventario', p_qtd: Number(i.value), p_pessoa: p, p_obs: $('#inv_o').value.trim() || null});
      if (e) { aviso(msgErro(e), true); break; }
      ok++;
    }
    b.disabled = false;
    if (ok) aviso(ok + (ok === 1 ? ' item conferido.' : ' itens conferidos.'));
    if (ok === campos.length) viewInventario();
  };
}

  const nm = x => typeof x === 'string' ? esc(x) : `${fotoImg(x.foto, 28)}${esc(x.nome)}${x.n != null ? ` <span class="suave">(${x.n} consulente${x.n === 1 ? '' : 's'})</span>` : ''}`;
  const ul = l => l.length ? `<ul style="list-style:none;padding:0">${l.map(x => `<li style="margin:.25rem 0">${nm(x)}</li>`).join('')}</ul>` : '<p class="suave">Nenhum.</p>';
  const g = (n, t, l) => `<h3>${n}) ${t} (${l.length})</h3>${ul(l)}`;
  const cl = c => `<li>${esc(c.nome)} — ${c.astral ? 'Astral decide' : c.medium ? fotoImg(c.medium_foto, 24) + esc(c.medium) + (c.medium_ok === false ? ' <span class="pr-pend">médium ausente: definir outro</span>' : '') : '<span class="pr-pend">sem médium incorporante definido</span>'}</li>`;
  return `<div class="lista-pres"><h3>1) Consulentes por ordem de confirmação (${d.consulentes.length})</h3>${d.consulentes.length ? `<ol>${d.consulentes.map(cl).join('')}</ol>` : '<p class="suave">Nenhum.</p>'}
    ${g(2, 'Incorporantes presentes', d.incorporantes || [])}${g(3, 'Curimbeiros presentes', d.curimba)}${g(4, 'Cambones presentes', d.cambone)}
    <h3>Faltas não justificadas (${d.faltas.length})</h3>${d.passou ? ul(d.faltas) : '<p class="suave">Aparecem depois da gira, conforme a chamada.</p>'}</div>`;
}

function relGira(ev, todos, fq, cs, pr, fi) {
  const med = todos.filter(m => m.tipo === 'medium'), st = {}, pv = {};
  fq.filter(x => x.evento_id === ev.id).forEach(x => { st[x.membro_id] = x; });
  const prs = pr.filter(x => x.evento_id === ev.id); prs.forEach(x => { pv[x.membro_id] = x; });
  const por = id => todos.find(x => x.id === id) || {}, ft = id => (fi.find(x => x.membro_id === id) || {}).foto || null;
  const presente = m => st[m.id] ? st[m.id].status === 'presente' : !!(pv[m.id] && pv[m.id].vai === true);
  const site = prs.filter(x => x.vai === true && por(x.membro_id).tipo === 'consulente').sort((a, b) => String(a.atualizado_em).localeCompare(String(b.atualizado_em)))
    .map(x => ({nome: por(x.membro_id).nome, medium_id: x.medium_id, astral: !!x.astral, cid: x.membro_id}));
  const manual = cs.filter(c => c.evento_id === ev.id && !site.some(d => d.cid === c.consulente_id)).map(c => ({nome: c.nome, medium_id: c.medium_id, astral: false}));
  const cons = [...site, ...manual], com = k => med.filter(m => presente(m) && (m.funcoes || []).includes(k));
  return htmlRelGira({
    consulentes: cons.map(c => ({nome: c.nome, astral: c.astral, medium: c.medium_id ? por(c.medium_id).nome : null, medium_foto: c.medium_id ? ft(c.medium_id) : null, medium_ok: c.medium_id ? presente(por(c.medium_id)) : null})),
    incorporantes: com('incorporante').map(m => ({nome: m.nome, foto: ft(m.id), n: cons.filter(c => c.medium_id === m.id).length})),
    curimba: com('curimba').map(m => ({nome: m.nome, foto: ft(m.id)})), cambone: com('cambone').map(m => ({nome: m.nome, foto: ft(m.id)})),
    faltas: med.filter(m => st[m.id] && st[m.id].status === 'ausente').map(m => m.nome),
    passou: new Date(ev.data_hora) < new Date()
  });
}

async function abrirChamada(ev, med, aoSalvar) {
  const [f, p] = await Promise.all([sb.from('frequencia').select('*').eq('evento_id', ev.id), sb.from('presencas').select('membro_id,vai,motivo').eq('evento_id', ev.id)]);
  if (f.error || p.error) { aviso(msgErro(f.error || p.error), true); return; }
  if (!med.length) { aviso('Nenhum médium cadastrado ainda.', true); return; }
  const F = {}, P = {}; f.data.forEach(x => { F[x.membro_id] = x; }); p.data.forEach(x => { P[x.membro_id] = x; });
  const pad = m => P[m.id] && P[m.id].vai === false && P[m.id].motivo ? {status: 'justificada', motivo: P[m.id].motivo} : P[m.id] && P[m.id].vai === true ? {status: 'presente', motivo: ''} : {status: 'sem', motivo: ''};
  const ini = m => F[m.id] || pad(m);
  const d = $('#dlg'); d.onclick = null; d.onclose = null;
  d.innerHTML = `<form id="frm" novalidate><h2 id="dlgT">Chamada: ${esc(ev.titulo)}</h2><p class="suave">${dataHoraBR(ev.data_hora)}. Quem confirmou "Irei" já vem como presente e quem avisou que não iria, com motivo, como justificado. Digite o nome de quem faltou e marque "Não compareceu". A justificativa pode ser registrada depois.</p>
    <label for="busca">Buscar médium</label><input id="busca" type="search" autocomplete="off"><label class="chk"><input type="checkbox" id="soFaltas">Mostrar só faltas sem justificativa</label>
    <ul class="lista-m">${med.map(m => { const s = ini(m); return `<li data-m="${m.id}"><strong>${esc(m.nome)}</strong> <span class="suave">${esc(resumoPessoa(m))}</span><div class="pr-linha" style="flex-wrap:wrap">${[['presente', 'Presente'], ['ausente', 'Não compareceu'], ['justificada', 'Falta justificada'], ['sem', 'Sem resposta']].map(([v, t]) => `<label class="chk"><input type="radio" name="s${m.id}" value="${v}"${s.status === v ? ' checked' : ''}>${t}</label>`).join('')}</div><input class="mot" maxlength="200" placeholder="Motivo (se justificado)" aria-label="Motivo de ${esc(m.nome)}" value="${esc(s.motivo || '')}" style="margin-top:.4rem"></li>`; }).join('')}</ul>
    <p class="erro" id="erroF" role="alert"></p><div class="rodape"><button type="button" class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="salvar">Salvar chamada</button></div></form>`;
  d.showModal();
  $('#cancelar').onclick = () => d.close();
  const filtrar = () => { const t = norm($('#busca').value), sf = $('#soFaltas').checked; d.querySelectorAll('li[data-m]').forEach(li => { li.hidden = !norm(li.querySelector('strong').textContent).includes(t) || (sf && li.querySelector('input[type=radio]:checked').value !== 'ausente'); }); };
  $('#busca').oninput = filtrar; $('#soFaltas').onchange = filtrar; d.addEventListener('change', filtrar);
  $('#frm').onsubmit = async e => {
    e.preventDefault();
    const rows = [...d.querySelectorAll('li[data-m]')].map(li => {
      const s = li.querySelector('input[type=radio]:checked').value, mot = li.querySelector('.mot').value.trim();
      return {evento_id: ev.id, membro_id: Number(li.dataset.m), status: s, motivo: s === 'presente' || s === 'sem' ? null : (mot || null), atualizado_em: new Date().toISOString()};
    }).filter(r => F[r.membro_id] ? true : r.status !== pad({id: r.membro_id}).status && r.status !== 'sem');
    const btn = $('#salvar'); btn.disabled = true;
    const up = rows.filter(r => r.status !== 'sem'), del = rows.filter(r => r.status === 'sem').map(r => r.membro_id);
    let error = null;
    if (up.length) error = (await sb.from('frequencia').upsert(up, {onConflict: 'evento_id,membro_id'})).error;
    if (!error && del.length) error = (await sb.from('frequencia').delete().eq('evento_id', ev.id).in('membro_id', del)).error;
    if (error) { $('#erroF').textContent = msgErro(error); btn.disabled = false; return; }
    d.close(); aviso('Chamada salva.'); aoSalvar();
  };
}

async function abrirConsulentes(ev, todos, aoMudar) {
  const d = $('#dlg'); let mudou = false;
  const inc = todos.filter(m => m.tipo === 'medium' && (m.funcoes || []).includes('incorporante'));
  d.onclick = null;
  d.innerHTML = `<h2 id="dlgT">Consulentes confirmados: ${esc(ev.titulo)}</h2><p class="suave">${dataHoraBR(ev.data_hora)}. Indique o médium incorporante que vai atender cada consulente.</p><div id="corpoC"><p class="vazio">Carregando…</p></div>
    <form id="frmC" novalidate><label for="c_nome">Consulente *</label><input id="c_nome" list="dlCons" maxlength="120" autocomplete="off"><datalist id="dlCons">${todos.filter(x => x.tipo === 'consulente').map(x => `<option value="${esc(x.nome)}">`).join('')}</datalist>
    <label for="c_med">Médium incorporante</label><select id="c_med"><option value="">Ainda não definido</option>${inc.map(m => `<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select>
    <p class="erro" id="erroF" role="alert"></p><div class="rodape"><button type="button" class="btn sec" id="fechar">Fechar</button><button class="btn">Adicionar consulente</button></div></form>`;
  d.showModal();
  d.onchange = async e => {
    const sl = e.target.closest('select[data-pm]'); if (!sl) return;
    const {error} = await sb.from('presencas').update({medium_id: sl.value ? Number(sl.value) : null, astral: false}).eq('evento_id', ev.id).eq('membro_id', Number(sl.dataset.pm));
    if (error) { aviso(msgErro(error), true); return; }
    mudou = true; aviso('Médium definido.');
  };
  d.onclose = () => { d.onclick = null; d.onchange = null; d.onclose = null; if (mudou) aoMudar(); };
  $('#fechar').onclick = () => d.close();
  const desenhar = async () => {
    const [{data, error}, pc] = await Promise.all([sb.from('consulentes_gira').select('*').eq('evento_id', ev.id).order('id'), sb.from('presencas').select('membro_id,medium_id,astral').eq('evento_id', ev.id).eq('vai', true)]);
    const c = $('#corpoC'); if (!c) return;
    const site = (pc.data || []).filter(x => (todos.find(t => t.id === x.membro_id) || {}).tipo === 'consulente');
    const blocoSite = site.length ? `<p class="suave">Confirmados pelo site. Indique ou troque o médium incorporante:</p><ul class="lista-m">${site.map(x => `<li><strong>${esc((todos.find(t => t.id === x.membro_id) || {}).nome)}</strong><select data-pm="${x.membro_id}" aria-label="Médium incorporante"><option value="">${x.astral ? 'Astral decide (definir médium)' : 'Ainda não definido'}</option>${inc.map(m => `<option value="${m.id}"${x.medium_id === m.id ? ' selected' : ''}>${esc(m.nome)}</option>`).join('')}</select></li>`).join('')}</ul>` : '';
    if (error) { c.innerHTML = `<p class="erro">${esc(msgErro(error))}</p>`; return; }
    c.innerHTML = blocoSite + (data.length ? `<ul class="lista-m">${data.map(x => `<li><strong>${esc(x.nome)}</strong>${x.medium_id ? ' <span class="suave">— com ' + esc((todos.find(m => m.id === x.medium_id) || {}).nome || '') + '</span>' : ''} <button type="button" class="btn perigo peq" data-x="${x.id}">Remover</button></li>`).join('')}</ul>` : (site.length ? '' : '<p class="suave">Nenhum consulente confirmado ainda.</p>'));
  };
  d.onclick = async e => {
    const b = e.target.closest('button[data-x]'); if (!b) return;
    const {error} = await sb.from('consulentes_gira').delete().eq('id', Number(b.dataset.x));
    if (error) { aviso(msgErro(error), true); return; }
    mudou = true; desenhar();
  };
  $('#frmC').onsubmit = async e => {
    e.preventDefault();
    const nome = $('#c_nome').value.trim();
    if (!nome) { $('#erroF').textContent = 'Informe o nome do consulente.'; return; }
    const reg = todos.find(x => x.tipo === 'consulente' && norm(x.nome) === norm(nome));
    const {error} = await sb.from('consulentes_gira').insert({evento_id: ev.id, nome, consulente_id: reg ? reg.id : null, medium_id: $('#c_med').value ? Number($('#c_med').value) : null});
    if (error) { $('#erroF').textContent = msgErro(error); return; }
    $('#erroF').textContent = ''; $('#c_nome').value = ''; $('#c_nome').focus();
    mudou = true; desenhar();
  };
  desenhar();
}

const novaPerg = () => ({id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), tipo: 'texto', texto: '', opcoes: []});
const prazoTxt = q => q.prazo ? dataHoraBR(q.prazo) : 'Sem prazo';
const vencido = q => !!q.prazo && new Date(q.prazo) < new Date();
const fmtNota = n => String(n).replace('.', ',');
const temNota = r => !!r && r.nota !== null && r.nota !== undefined;
const respostaHtml = (q, r) => (q.perguntas || []).map((p, i) => {
  const v = r && r.respostas ? r.respostas[p.id] : '';
  return `<p><strong>${i + 1}. ${esc(p.texto)}</strong><br>${v ? texto(v) : '<span class="suave">(sem resposta)</span>'}</p>`;
}).join('');

function sitMed(r) {
  const dia = Number(hoje().slice(8, 10));
  const ativ = r.ativ_atrasadas === 0, giras = r.faltas === 0, mens = r.mensalidade_paga || dia <= DIA_VENC;
  return {
    ativ, giras, mens,
    tAtiv: ativ ? (r.ativ_pendentes ? `Em dia (${r.ativ_pendentes} a entregar no prazo)` : 'Em dia') : `${r.ativ_atrasadas} atrasada(s)`,
    tGiras: giras ? 'Em dia' : `${r.faltas} falta(s) sem justificativa`,
    tMens: r.mensalidade_paga ? 'Paga' : (dia <= DIA_VENC ? `A vencer (até o dia ${DIA_VENC})` : 'Em atraso')
  };
}

async function carregarSituacao() {
  const agora = new Date().toISOString();
  const [s, f, i] = await Promise.all([
    sb.rpc('painel_situacao'),
    sb.from('eventos').select('*').eq('tipo', 'festa').gte('data_hora', agora).order('data_hora').limit(1),
    sb.from('eventos').select('*').eq('tipo', 'iniciacao').gte('data_hora', agora).order('data_hora').limit(1)
  ]);
  return {s, f, i};
}

function blocoProximos(f, i) {
  const bloco = (t, r, vazio) => `<section class="cartao"><h2>${t}</h2>${r.error ? `<p class="erro">${esc(msgErro(r.error))}</p>` : r.data.length ? blocoEvento(r.data[0], null) : `<p class="vazio">${vazio}</p>`}</section>`;
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-bottom:1rem">${bloco('Próxima festa', f, 'Nenhuma festa agendada. Cadastre em Eventos com o tipo "Festa / evento".')}${bloco('Próxima iniciação', i, 'Nenhuma iniciação agendada. Cadastre em Eventos com o tipo "Iniciação".')}</div>`;
}

/* ----- Painel do administrador: situação de todos os médiuns ----- */

async function viewSituacao() {
  app.innerHTML = abas('#/admin/situacao') + `<div class="cab"><h1>Situação dos médiuns</h1><button class="btn sec" onclick="window.print()">Imprimir</button></div>
    <p class="suave">Atividades: nenhum questionário vencido sem entrega. Giras: nenhuma falta sem justificativa nos últimos ${JANELA_GIRAS} dias. Mensalidade: paga neste mês ou ainda dentro do prazo (dia ${DIA_VENC}).</p><div id="corpo"><p class="vazio">Carregando…</p></div>`;
  const {s, f, i} = await carregarSituacao();
  if (s.error) { $('#corpo').innerHTML = `<p class="erro">${esc(msgErro(s.error))}</p>`; return; }
  const linhas = s.data.map(r => ({r, st: sitMed(r)})), n = linhas.length;
  const tot = k => linhas.filter(x => x.st[k]).length;
  const card = (t, k) => `<div><span>${t}</span><strong class="${tot(k) === n ? 'ok' : 'neg'}">${tot(k)} de ${n}</strong></div>`;
  const cel = (ok, t) => `<td class="${ok ? 'ok' : 'neg'}">${ok ? '✓ ' : '✗ '}${esc(t)}</td>`;
  $('#corpo').innerHTML = (n ? `<div class="totais">${card('Em dia com atividades', 'ativ')}${card('Em dia com as giras', 'giras')}${card('Em dia com a mensalidade', 'mens')}</div>` : '')
    + blocoProximos(f, i)
    + (n ? `<div class="rolagem"><table><thead><tr><th>Médium</th><th>Atividades</th><th>Giras</th><th>Mensalidade</th></tr></thead><tbody>`
      + linhas.map(({r, st}) => `<tr class="${st.ativ && st.giras && st.mens ? '' : 'alerta'}"><td>${esc(r.nome_membro)}</td>${cel(st.ativ, st.tAtiv)}${cel(st.giras, st.tGiras)}${cel(st.mens, st.tMens)}</tr>`).join('')
      + '</tbody></table></div>' : '<p class="vazio">Nenhum médium cadastrado. Cadastre em Membros com o tipo "Médium".</p>');
}

/* ----- Administrador: criar e gerenciar questionários ----- */

async function viewQuestionarios() {
  app.innerHTML = abas('#/admin/questionarios') + sub(SUBQ, '#/admin/questionarios') + `<div class="cab"><h1>Questionários</h1><button class="btn" id="novo">Novo questionário</button></div>
    <p class="suave">Atividades para os médiuns responderem. As respostas e as notas ficam só nesta conta de administrador.</p><div id="lista"><p class="vazio">Carregando…</p></div>`;
  let qs = [];
  const carregar = async () => {
    const [q, d, r] = await Promise.all([
      sb.from('questionarios').select('*').order('criado_em', {ascending: false}),
      sb.from('questionario_destinatarios').select('questionario_id,membro_id'),
      sb.from('respostas_questionario').select('questionario_id,nota')
    ]);
    const er = q.error || d.error || r.error;
    if (er) { $('#lista').innerHTML = `<p class="erro">${esc(msgErro(er))}</p>`; return; }
    qs = q.data;
    if (!qs.length) { $('#lista').innerHTML = '<p class="vazio">Nenhum questionário ainda. Toque em "Novo questionário", escreva as perguntas e escolha os médiuns.</p>'; return; }
    $('#lista').innerHTML = `<div class="rolagem"><table><thead><tr><th>Título</th><th>Prazo</th><th>Situação</th><th class="num">Destinatários</th><th class="num">Entregues</th><th class="num">Corrigidos</th><th></th></tr></thead><tbody>`
      + qs.map(x => {
        const dest = d.data.filter(y => y.questionario_id === x.id).length, rs = r.data.filter(y => y.questionario_id === x.id);
        return `<tr><td>${esc(x.titulo)}</td><td>${esc(prazoTxt(x))}</td><td class="${x.publicado ? 'ok' : 'rasc'}">${x.publicado ? 'Publicado' : 'Rascunho'}</td><td class="num">${dest}</td><td class="num">${rs.length}</td><td class="num">${rs.filter(temNota).length}</td>
          <td class="acoes"><button class="btn sec peq" data-a="e" data-id="${x.id}">Editar</button> <button class="btn perigo peq" data-a="x" data-id="${x.id}">Excluir</button></td></tr>`;
      }).join('') + '</tbody></table></div>';
  };
  $('#novo').onclick = () => abrirFormQuest(null, carregar);
  $('#lista').onclick = async ev => {
    const b = ev.target.closest('button[data-a]'); if (!b) return;
    const q = qs.find(x => String(x.id) === b.dataset.id); if (!q) return;
    if (b.dataset.a === 'e') { abrirFormQuest(q, carregar); return; }
    if (!(await confirmar(`Excluir "${q.titulo}"? As respostas e as notas deste questionário também serão apagadas. Esta ação não pode ser desfeita.`, 'Excluir questionário'))) return;
    const {data, error} = await sb.from('questionarios').delete().eq('id', q.id).select();
    if (error || !data || !data.length) { aviso(error ? msgErro(error) : 'Não foi possível excluir.', true); return; }
    aviso('Excluído.'); carregar();
  };
  carregar();
}

async function abrirFormQuest(q, aoSalvar) {
  const novo = !q;
  const [mm, dd] = await Promise.all([
    sb.from('membros').select('id,nome').eq('tipo', 'medium').order('nome'),
    novo ? Promise.resolve({data: []}) : sb.from('questionario_destinatarios').select('membro_id').eq('questionario_id', q.id)
  ]);
  if (mm.error || dd.error) { aviso(msgErro(mm.error || dd.error), true); return; }
  if (!mm.data.length) { aviso('Nenhum médium cadastrado. Cadastre em Membros com o tipo "Médium".', true); return; }
  const inicial = new Set(dd.data.map(x => x.membro_id));
  let perg = novo ? [novaPerg()] : (q.perguntas || []).map(p => ({...p}));
  if (!perg.length) perg = [novaPerg()];
  const d = $('#dlg'); d.onclick = null; d.onclose = null;
  const desenharPerg = () => {
    $('#qPerg').innerHTML = perg.map((p, i) => `<div class="sec-m qp" data-id="${esc(p.id)}"><h3>Pergunta ${i + 1}</h3>
      <label for="qt_${esc(p.id)}">Enunciado *</label><textarea id="qt_${esc(p.id)}" class="qp-texto" style="min-height:70px">${esc(p.texto)}</textarea>
      <label for="qy_${esc(p.id)}">Tipo de resposta</label><select id="qy_${esc(p.id)}" class="qp-tipo"><option value="texto"${p.tipo === 'texto' ? ' selected' : ''}>Resposta escrita</option><option value="escolha"${p.tipo === 'escolha' ? ' selected' : ''}>Múltipla escolha</option></select>
      <div class="qp-opwrap"${p.tipo === 'escolha' ? '' : ' hidden'}><label for="qo_${esc(p.id)}">Opções (uma por linha)</label><textarea id="qo_${esc(p.id)}" class="qp-ops" style="min-height:90px">${esc((p.opcoes || []).join('\n'))}</textarea></div>
      ${perg.length > 1 ? `<div class="rodape" style="margin-top:.6rem"><button type="button" class="btn perigo peq" data-qa="rm" data-i="${i}">Remover pergunta</button></div>` : ''}</div>`).join('');
  };
  const ler = () => {
    perg = [...d.querySelectorAll('.qp')].map(el => ({
      id: el.dataset.id, tipo: el.querySelector('.qp-tipo').value, texto: el.querySelector('.qp-texto').value.trim(),
      opcoes: el.querySelector('.qp-ops').value.split('\n').map(s => s.trim()).filter(Boolean)
    }));
  };
  d.innerHTML = `<form id="frm" novalidate><h2 id="dlgT">${novo ? 'Novo questionário' : 'Editar questionário'}</h2>
    <label for="q_tit">Título *</label><input id="q_tit" maxlength="150" value="${esc(q ? q.titulo : '')}">
    <label for="q_desc">Orientações (opcional)</label><textarea id="q_desc" style="min-height:70px">${esc(q && q.descricao ? q.descricao : '')}</textarea>
    <label for="q_prazo">Prazo de entrega (opcional)</label><input id="q_prazo" type="datetime-local" value="${q && q.prazo ? paraLocal(q.prazo) : ''}">
    <label class="chk"><input type="checkbox" id="q_pub"${!q || q.publicado ? ' checked' : ''}>Publicar para os médiuns agora (desmarque para deixar como rascunho)</label>
    <h3 style="margin-top:1rem">Perguntas</h3><div id="qPerg"></div>
    <button type="button" class="btn sec peq" data-qa="add" style="margin-top:.6rem">+ Adicionar pergunta</button>
    <h3 style="margin-top:1rem">Quem deve responder *</h3>
    <button type="button" class="btn sec peq" data-qa="todos">Marcar todos</button> <button type="button" class="btn sec peq" data-qa="nenhum">Desmarcar todos</button>
    <div id="qDest">${mm.data.map(m => `<label class="chk op"><input type="checkbox" name="q_dest" value="${m.id}"${inicial.has(m.id) ? ' checked' : ''}><span>${esc(m.nome)}</span></label>`).join('')}</div>
    <p class="erro" id="erroF" role="alert"></p><div class="rodape"><button type="button" class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="salvar">Salvar questionário</button></div></form>`;
  desenharPerg();
  d.showModal();
  $('#q_tit').focus();
  $('#cancelar').onclick = () => d.close();
  const erro = t => { $('#erroF').textContent = t; };
  d.onchange = e => {
    const s = e.target.closest('.qp-tipo'); if (!s) return;
    s.closest('.qp').querySelector('.qp-opwrap').hidden = s.value !== 'escolha';
  };
  d.onclick = e => {
    const b = e.target.closest('button[data-qa]'); if (!b) return;
    const a = b.dataset.qa;
    if (a === 'add') { ler(); perg.push(novaPerg()); desenharPerg(); const ult = d.querySelectorAll('.qp-texto'); ult[ult.length - 1].focus(); }
    else if (a === 'rm') { ler(); perg.splice(Number(b.dataset.i), 1); desenharPerg(); }
    else if (a === 'todos' || a === 'nenhum') d.querySelectorAll('input[name=q_dest]').forEach(c => { c.checked = a === 'todos'; });
  };
  $('#frm').onsubmit = async ev => {
    ev.preventDefault();
    ler();
    const titulo = $('#q_tit').value.trim();
    if (!titulo) { erro('Preencha o título.'); $('#q_tit').focus(); return; }
    for (let i = 0; i < perg.length; i++) {
      if (!perg[i].texto) { erro(`Escreva o enunciado da pergunta ${i + 1}.`); return; }
      if (perg[i].tipo === 'escolha' && perg[i].opcoes.length < 2) { erro(`A pergunta ${i + 1} precisa de pelo menos 2 opções.`); return; }
    }
    const marcados = new Set([...d.querySelectorAll('input[name=q_dest]:checked')].map(c => Number(c.value)));
    if (!marcados.size) { erro('Marque pelo menos um médium.'); return; }
    const pz = $('#q_prazo').value;
    const obj = {titulo, descricao: $('#q_desc').value.trim() || null, prazo: pz ? new Date(pz).toISOString() : null, publicado: $('#q_pub').checked,
      perguntas: perg.map(p => ({id: p.id, tipo: p.tipo, texto: p.texto, opcoes: p.tipo === 'escolha' ? p.opcoes : []}))};
    const btn = $('#salvar'); btn.disabled = true; erro('');
    const res = novo ? await sb.from('questionarios').insert(obj).select() : await sb.from('questionarios').update(obj).eq('id', q.id).select();
    if (res.error || !res.data || !res.data.length) { erro(res.error ? msgErro(res.error) : 'Não foi possível salvar.'); btn.disabled = false; return; }
    const qid = res.data[0].id;
    const add = [...marcados].filter(id => !inicial.has(id)), tirar = [...inicial].filter(id => !marcados.has(id));
    let e2 = null;
    if (add.length) e2 = (await sb.from('questionario_destinatarios').insert(add.map(id => ({questionario_id: qid, membro_id: id})))).error;
    if (!e2 && tirar.length) e2 = (await sb.from('questionario_destinatarios').delete().eq('questionario_id', qid).in('membro_id', tirar)).error;
    if (e2) { erro('O questionário foi salvo, mas a lista de médiuns falhou: ' + msgErro(e2)); btn.disabled = false; return; }
    d.onchange = null; d.close(); aviso('Salvo.'); aoSalvar();
  };
}

/* ----- Administrador: entregues e notas ----- */

async function viewEntregas() {
  app.innerHTML = abas('#/admin/questionarios') + sub(SUBQ, '#/admin/questionarios/entregas') + `<div class="cab"><h1>Entregues e notas</h1></div>
    <div class="filtros"><select id="fq" aria-label="Questionário" style="max-width:280px"><option value="">Todos os questionários</option></select>
    <select id="fs" aria-label="Situação" style="max-width:210px"><option value="">Todas as situações</option><option value="entregue">Aguardando nota</option><option value="corrigida">Corrigidas</option><option value="pendente">Não entregues</option></select></div><div id="lista"><p class="vazio">Carregando…</p></div>`;
  let qs = [], linhas = [];
  const desenhar = () => {
    const fq = $('#fq').value, fs = $('#fs').value;
    const rs = linhas.filter(x => (!fq || String(x.q.id) === fq) && (!fs || x.st === fs));
    if (!linhas.length) { $('#lista').innerHTML = '<p class="vazio">Nada por aqui ainda. Crie um questionário na aba "Questionários".</p>'; return; }
    if (!rs.length) { $('#lista').innerHTML = '<p class="vazio">Nada encontrado com esse filtro.</p>'; return; }
    const rot = {pendente: 'Não entregue', entregue: 'Aguardando nota', corrigida: 'Corrigida'};
    $('#lista').innerHTML = `<div class="rolagem"><table><thead><tr><th>Questionário</th><th>Médium</th><th>Situação</th><th>Entregue em</th><th class="num">Nota</th><th></th></tr></thead><tbody>`
      + rs.map((x, i) => `<tr><td>${esc(x.q.titulo)}</td><td>${esc(x.nome)}</td><td class="${x.st === 'corrigida' ? 'ok' : x.st === 'pendente' && vencido(x.q) ? 'neg' : ''}">${rot[x.st]}${x.st === 'pendente' && vencido(x.q) ? ' (atrasada)' : ''}</td>
        <td>${x.r ? esc(dataHoraBR(x.r.enviada_em)) : ''}</td><td class="num">${temNota(x.r) ? fmtNota(x.r.nota) : ''}</td>
        <td class="acoes">${x.r ? `<button class="btn peq" data-i="${linhas.indexOf(x)}">${x.st === 'corrigida' ? 'Rever' : 'Ver e dar nota'}</button>` : ''}</td></tr>`).join('')
      + '</tbody></table></div>';
  };
  const carregar = async () => {
    const [q, d, r, m] = await Promise.all([
      sb.from('questionarios').select('*').order('criado_em', {ascending: false}),
      sb.from('questionario_destinatarios').select('questionario_id,membro_id'),
      sb.from('respostas_questionario').select('*'),
      sb.from('membros').select('id,nome')
    ]);
    const er = q.error || d.error || r.error || m.error;
    if (er) { $('#lista').innerHTML = `<p class="erro">${esc(msgErro(er))}</p>`; return; }
    qs = q.data;
    const nomes = {}; m.data.forEach(x => { nomes[x.id] = x.nome; });
    const sel = $('#fq'), atual = sel.value;
    sel.innerHTML = '<option value="">Todos os questionários</option>' + qs.map(x => `<option value="${x.id}">${esc(x.titulo)}</option>`).join('');
    sel.value = atual;
    linhas = [];
    qs.forEach(x => d.data.filter(y => y.questionario_id === x.id).map(y => ({q: x, nome: nomes[y.membro_id] || '(removido)', r: r.data.find(z => z.questionario_id === x.id && z.membro_id === y.membro_id) || null}))
      .sort((a, b) => a.nome.localeCompare(b.nome)).forEach(y => { y.st = y.r ? (temNota(y.r) ? 'corrigida' : 'entregue') : 'pendente'; linhas.push(y); }));
    desenhar();
  };
  $('#fq').onchange = desenhar; $('#fs').onchange = desenhar;
  $('#lista').onclick = ev => {
    const b = ev.target.closest('button[data-i]'); if (!b) return;
    const x = linhas[Number(b.dataset.i)]; if (x && x.r) abrirCorrecao(x.q, x.nome, x.r, carregar);
  };
  carregar();
}

function abrirCorrecao(q, nome, r, aoSalvar) {
  const d = $('#dlg'); d.onclick = null; d.onclose = null; d.onchange = null;
  const fora = q.prazo && new Date(r.enviada_em) > new Date(q.prazo);
  d.innerHTML = `<form id="frm" novalidate><h2 id="dlgT">${esc(q.titulo)}</h2><p class="suave">Médium: ${esc(nome)} · entregue em ${esc(dataHoraBR(r.enviada_em))}${fora ? ' (fora do prazo)' : ''}</p>${respostaHtml(q, r)}
    <label for="n_nota">Nota (0 a 10) *</label><input id="n_nota" type="number" min="0" max="10" step="0.1" inputmode="decimal" value="${temNota(r) ? esc(r.nota) : ''}">
    <label for="n_com">Comentário (o médium vê)</label><textarea id="n_com" style="min-height:90px">${esc(r.comentario || '')}</textarea>
    <p class="erro" id="erroF" role="alert"></p><div class="rodape"><button type="button" class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="salvar">Salvar nota</button></div></form>`;
  d.showModal(); $('#n_nota').focus();
  $('#cancelar').onclick = () => d.close();
  $('#frm').onsubmit = async ev => {
    ev.preventDefault();
    const v = parseFloat($('#n_nota').value);
    if (isNaN(v) || v < 0 || v > 10) { $('#erroF').textContent = 'Informe uma nota entre 0 e 10.'; $('#n_nota').focus(); return; }
    const btn = $('#salvar'); btn.disabled = true;
    const {data, error} = await sb.from('respostas_questionario').update({nota: v, comentario: $('#n_com').value.trim() || null}).eq('id', r.id).select();
    if (error || !data || !data.length) { $('#erroF').textContent = error ? msgErro(error) : 'Não foi possível salvar a nota.'; btn.disabled = false; return; }
    d.close(); aviso('Nota salva.'); aoSalvar();
  };
}

/* ----- Médium: situação própria e atividades ----- */

function abrirResposta(q, r, aoSalvar) {
  const d = $('#dlg'); d.onclick = null; d.onclose = null; d.onchange = null;
  if (temNota(r)) {
    d.innerHTML = `<h2 id="dlgT">${esc(q.titulo)}</h2><p>Sua nota: <strong>${fmtNota(r.nota)}</strong> de 10</p>${r.comentario ? `<div class="ajuda">${texto(r.comentario)}</div>` : ''}${respostaHtml(q, r)}<div class="rodape"><button class="btn" id="fechar" type="button">Fechar</button></div>`;
    d.showModal(); $('#fechar').onclick = () => d.close(); return;
  }
  const ant = r && r.respostas ? r.respostas : {};
  const campo = (p, i) => p.tipo === 'escolha'
    ? `<p style="margin:.9rem 0 .2rem"><strong>${i + 1}. ${esc(p.texto)}</strong></p>` + (p.opcoes || []).map(o => `<label class="chk op"><input type="radio" name="r_${esc(p.id)}" value="${esc(o)}"${ant[p.id] === o ? ' checked' : ''}><span>${esc(o)}</span></label>`).join('')
    : `<label for="r_${esc(p.id)}">${i + 1}. ${esc(p.texto)}</label><textarea id="r_${esc(p.id)}">${esc(ant[p.id] || '')}</textarea>`;
  d.innerHTML = `<form id="frm" novalidate><h2 id="dlgT">${esc(q.titulo)}</h2><p class="suave">${esc(prazoTxt(q) === 'Sem prazo' ? 'Sem prazo de entrega.' : 'Prazo: ' + prazoTxt(q))}${vencido(q) ? ' (já venceu, mas você ainda pode entregar)' : ''}</p>${q.descricao ? `<div class="ajuda">${texto(q.descricao)}</div>` : ''}
    ${(q.perguntas || []).map(campo).join('')}<p class="erro" id="erroF" role="alert"></p>
    <div class="rodape"><button type="button" class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="salvar">${r ? 'Atualizar resposta' : 'Enviar resposta'}</button></div></form>`;
  d.showModal();
  $('#cancelar').onclick = () => d.close();
  $('#frm').onsubmit = async ev => {
    ev.preventDefault();
    const obj = {};
    for (let i = 0; i < (q.perguntas || []).length; i++) {

      : '<p class="vazio">Nenhum questionário para você no momento.</p>';

  };
