let INCORP = [];
const p2 = n => String(n).padStart(2, '0');
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const FASES = ['Lua nova', 'Quarto crescente', 'Lua cheia', 'Quarto minguante'], ICO = ['🌑', '🌓', '🌕', '🌗'];
const LEMBRETE_LUA = 'Dia de movimentar o Obaroxo';
const fusoLua = {timeZone: 'America/Sao_Paulo'};
const meuCad = () => perfil ? (perfil.cad_id || perfil.membro_id || null) : null;

function faseMs(k, f) {
  const kk = k + f / 4, T = kk / 1236.85, r = Math.PI / 180, s = Math.sin, co = Math.cos;
  const E = 1 - 0.002516 * T - 0.0000074 * T * T;
  const M = (2.5534 + 29.1053567 * kk - 0.0000014 * T * T) * r;
  const Mp = (201.5643 + 385.81693528 * kk + 0.0107582 * T * T) * r;
  const F = (160.7108 + 390.67050284 * kk - 0.0016118 * T * T) * r;
  const Om = (124.7746 - 1.56375588 * kk + 0.0020672 * T * T) * r;
  let jde = 2451550.09766 + 29.530588861 * kk + 0.00015437 * T * T, c;
  if (f === 0 || f === 2) {
    const a = f === 0 ? [-0.4072, 0.17241, 0.01608, 0.01039, 0.00739, -0.00514, 0.00208] : [-0.40614, 0.17302, 0.01614, 0.01043, 0.00734, -0.00515, 0.00209];
    c = a[0] * s(Mp) + a[1] * E * s(M) + a[2] * s(2 * Mp) + a[3] * s(2 * F) + a[4] * E * s(Mp - M) + a[5] * E * s(Mp + M) + a[6] * E * E * s(2 * M)
      - 0.00111 * s(Mp - 2 * F) - 0.00057 * s(Mp + 2 * F) + 0.00056 * E * s(2 * Mp + M) - 0.00042 * s(3 * Mp) + 0.00042 * E * s(M + 2 * F) + 0.00038 * E * s(M - 2 * F) - 0.00024 * E * s(2 * Mp - M);
  } else {
    c = -0.62801 * s(Mp) + 0.17172 * E * s(M) - 0.01183 * E * s(Mp + M) + 0.00862 * s(2 * Mp) + 0.00804 * s(2 * F) + 0.00454 * E * s(Mp - M) + 0.00204 * E * E * s(2 * M)
      - 0.0018 * s(Mp - 2 * F) - 0.0007 * s(Mp + 2 * F) - 0.0004 * s(3 * Mp) - 0.00034 * E * s(2 * Mp - M) + 0.00032 * E * s(M + 2 * F) + 0.00032 * E * s(M - 2 * F)
      - 0.00028 * E * E * s(Mp + 2 * M) + 0.00027 * E * s(2 * Mp + M) - 0.00017 * s(Om);
    const W = 0.00306 - 0.00038 * E * co(M) + 0.00026 * co(Mp) - 0.00002 * co(Mp - M) + 0.00002 * co(Mp + M) + 0.00002 * co(2 * F);
    c += f === 1 ? W : -W;
  }
  return (jde + c - 2440587.5) * 864e5;
}

function fasesDoMes(a, m) {
  const k0 = Math.floor((a + m / 12 - 2000) * 12.3685) - 1, pre = `${a}-${p2(m + 1)}`, out = [];
  for (let k = k0; k <= k0 + 3; k++) for (let f = 0; f < 4; f++) {
    const ms = faseMs(k, f), d = new Date(ms), iso = d.toLocaleDateString('sv-SE', fusoLua);
    if (iso.startsWith(pre)) out.push({iso, f, ms, hora: d.toLocaleTimeString('pt-BR', {...fusoLua, hour: '2-digit', minute: '2-digit'})});
  }
  return out.sort((x, y) => x.ms - y.ms);
}

function gradeMes(a, m, fn) {
  let h = '<div class="cal">' + ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(x => `<b>${x}</b>`).join('');
  for (let i = 0; i < new Date(a, m, 1).getDay(); i++) h += '<i></i>';
  for (let d = 1, n = new Date(a, m + 1, 0).getDate(); d <= n; d++) {
    const iso = `${a}-${p2(m + 1)}-${p2(d)}`, o = fn(iso) || {};
    h += `<button type="button" class="cd ${o.cls || ''}" data-d="${iso}">${d}${o.html || ''}</button>`;
  }
  return h + '</div>';
}

function montarSelData(box) {
  const inp = document.getElementById(box.dataset.alvo);
  let sel = inp.value ? new Date(inp.value) : null;
  const base = sel || new Date();
  let ver = new Date(base.getFullYear(), base.getMonth(), 1), hh = sel ? sel.getHours() : 19, mm = sel ? sel.getMinutes() : 30;
  const grava = () => { inp.value = sel ? `${isoD(sel)}T${p2(hh)}:${p2(mm)}` : ''; };
  const resumo = () => { const r = box.querySelector('.dsem'); if (r && sel) r.textContent = `${SEM[sel.getDay()]}, ${sel.toLocaleDateString('pt-BR')} às ${p2(hh)}:${p2(mm)}`; };
  const desenhar = () => {
    const a = ver.getFullYear(), m = ver.getMonth(), fs = {}, si = sel ? isoD(sel) : '';
    fasesDoMes(a, m).forEach(x => { fs[x.iso] = x; });
    const mins = [...Array(12).keys()].map(i => i * 5); if (!mins.includes(mm)) { mins.push(mm); mins.sort((x, y) => x - y); }
    box.innerHTML = `<div class="cal-cab"><button type="button" class="btn sec peq" data-n="-1" aria-label="Mês anterior">‹</button><strong>${MESES[m]} de ${a}</strong><button type="button" class="btn sec peq" data-n="1" aria-label="Próximo mês">›</button></div>`
      + gradeMes(a, m, iso => ({cls: iso === si ? 'sel' : iso === hoje() ? 'hj' : '', html: fs[iso] ? `<span class="lua" title="${FASES[fs[iso].f]}">${ICO[fs[iso].f]}</span>` : ''}))
      + (sel ? `<div class="hora"><label for="${inp.id}_h" style="margin:0">Hora</label><select id="${inp.id}_h">${Array.from({length: 24}, (_, i) => `<option value="${i}"${i === hh ? ' selected' : ''}>${p2(i)}</option>`).join('')}</select>:<select id="${inp.id}_m" aria-label="Minutos">${mins.map(i => `<option value="${i}"${i === mm ? ' selected' : ''}>${p2(i)}</option>`).join('')}</select></div><p class="dsem" aria-live="polite"></p>` : '<p class="suave">Escolha o dia no calendário. Depois defina a hora.</p>');
    resumo();
  };
  box.onclick = e => {
    const n = e.target.closest('[data-n]'), d = e.target.closest('[data-d]');
    if (n) { ver = new Date(ver.getFullYear(), ver.getMonth() + Number(n.dataset.n), 1); desenhar(); }
    else if (d) { sel = new Date(d.dataset.d + 'T00:00:00'); grava(); desenhar(); }
  };
  box.onchange = e => {
    if (e.target.id === inp.id + '_h') hh = Number(e.target.value); else if (e.target.id === inp.id + '_m') mm = Number(e.target.value); else return;
    grava(); resumo();
  };
  grava(); desenhar();
}

async function atualizarAvisos() {

    const ag = new Date(), iso = ag.toLocaleDateString('sv-SE', fusoLua), h = Number(ag.toLocaleTimeString('pt-BR', {...fusoLua, hour: '2-digit', hour12: false}));
    if (h >= 18) { const f = fasesDoMes(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)) - 1).find(x => x.iso === iso); if (f) itens.push(`${ICO[f.f]} ${LEMBRETE_LUA}: hoje é ${FASES[f.f].toLowerCase()}.`); }

      sb.from('eventos').select('id,titulo,data_hora').gte('data_hora', new Date().toISOString()).lte('data_hora', new Date(Date.now() + 3 * 36e5).toISOString()),

    if (c.error) { $('#cLista').innerHTML = `<p class="erro">${esc(msgErro(c.error))}</p>`; return; }
    nomes = {}; (m.data || []).forEach(x => { nomes[x.id] = x.nome; });
    linhas = c.data.sort((a, b) => (a.status === 'pendente' ? 0 : 1) - (b.status === 'pendente' ? 0 : 1)); desenhar();
  };
  $('#cLista').onclick = async ev => {
    const b = ev.target.closest('button[data-a]'); if (!b) return;
    const x = linhas.find(r => String(r.id) === b.dataset.id); if (!x) return;
    b.disabled = true;
    if (b.dataset.a === 'no') {
      if (!(await confirmar(`Marcar o aviso de ${nomes[x.membro_id] || ''} (${brl(x.valor)}) como não localizado?`, 'Não localizado'))) { b.disabled = false; return; }
      const r = await sb.from('contribuicoes_info').update({status: 'recusada'}).eq('id', x.id).select();
      if (r.error || !r.data || !r.data.length) { aviso(r.error ? msgErro(r.error) : 'Não foi possível salvar.', true); b.disabled = false; return; }
      aviso('Registrado.'); carregar(); return;
    }
    const l = await sb.from('lancamentos').insert({tipo: 'receita', descricao: 'Contribuição informada pelo site', categoria: 'doação', valor: x.valor, data: x.data, membro_id: x.membro_id}).select();
    if (l.error || !l.data || !l.data.length) { aviso(l.error ? msgErro(l.error) : 'Não foi possível lançar no Financeiro.', true); b.disabled = false; return; }
    const r = await sb.from('contribuicoes_info').update({status: 'confirmada'}).eq('id', x.id).select();
    if (r.error) { aviso('Lançado no Financeiro, mas o aviso não foi marcado como confirmado: ' + msgErro(r.error), true); carregar(); return; }
    aviso('Recebimento confirmado e lançado no Financeiro.'); carregar();
    const q = $('#busca'); if (q) q.dispatchEvent(new Event('input'));
  };
  carregar();
}

  };
  const carregar = async () => {
    const {data, error} = await sb.from('mensagens').select('*').order('criado_em', {ascending: false});
    if (error) { $('#lista').innerHTML = `<p class="erro">${esc(msgErro(error))}</p>`; return; }
    linhas = data; desenhar();
  };
  const responder = x => {
    const d = $('#dlg'); d.onclick = null; d.onclose = null;
    d.innerHTML = `<form id="frm" novalidate><h2 id="dlgT">${x.resposta ? 'Editar resposta' : 'Responder mensagem'}</h2><p class="suave"><strong>${esc(x.nome || 'Sem nome')}</strong> · ${TP_MSG[x.tipo] || ''} · ${dataHoraBR(x.criado_em)}</p><p>${texto(x.texto)}</p><label for="rs_tx">Sua resposta *</label><textarea id="rs_tx" rows="6" maxlength="2000">${esc(x.resposta || '')}</textarea><p class="erro" id="erroF" role="alert"></p><div class="rodape"><button type="button" class="btn sec" id="cancelar">Cancelar</button><button class="btn" id="salvar">Enviar resposta</button></div></form>`;
    d.showModal(); $('#rs_tx').focus();
    $('#cancelar').onclick = () => d.close();
    $('#frm').onsubmit = async ev => {
      ev.preventDefault();
      const tx = $('#rs_tx').value.trim();
      if (!tx) { $('#erroF').textContent = 'Escreva a resposta.'; return; }
      const btn = $('#salvar'); btn.disabled = true;
      const r = await sb.from('mensagens').update({resposta: tx, respondida_em: new Date().toISOString(), lida: true}).eq('id', x.id).select();
      if (r.error || !r.data || !r.data.length) { $('#erroF').textContent = r.error ? msgErro(r.error) : 'Não foi possível salvar a resposta.'; btn.disabled = false; return; }

  };

/* ---------- Corrente mediúnica ---------- */
const TIPOS_ENT = ['Pai Velho', 'Caboclo', 'Criança', 'Baiano', 'Boiadeiro', 'Marinheiro', 'Cigano', 'Exu', 'Pombagira', 'Exu Mirim', 'Pombagira Mirim', 'Malandro', 'Navalha'];
const GRAUS = ['1º grau', '2º grau', '3º grau', '4º grau', '5º grau', '6º grau', '7º grau'];
const fotoImg = (f, n = 56) => f ? `<img src="${esc(f)}" alt="" width="${n}" height="${n}" style="border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:.4rem">` : '';

function reduzirFoto(file) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 240 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => no(new Error('Imagem inválida.'));
    img.src = url;
  });
}

async function montarFicha(box, cad, admin) {
  const [f, c, m] = await Promise.all([
    sb.from('ficha_mediunica').select('*').eq('membro_id', cad).maybeSingle(),
    sb.from('entidades_catalogo').select('*').order('nome'),
    admin ? sb.from('membros').select('nome').eq('id', cad).maybeSingle() : Promise.resolve({data: {nome: perfil.nome}})
  ]);
  if (f.error || c.error) { box.innerHTML = `<p class="erro">${esc(msgErro(f.error || c.error))}</p>`; return; }
  const fi = f.data || {entidades: [], travada: false}, trav = !!fi.travada && !admin, nome = (m.data || {}).nome || '';
  const sel = new Set(fi.entidades || []), dis = trav ? ' disabled' : '';
  const nomes = t => c.data.filter(x => x.tipo === t && sel.has(x.id)).map(x => x.nome);
  box.innerHTML = `<div class="nao-imp">
    <div class="cartao" style="margin-bottom:1rem"><span id="fotoPrev">${fotoImg(fi.foto, 96)}</span>
      <label for="fotoArq">Foto (pequena)</label><input id="fotoArq" type="file" accept="image/*"><p class="suave">A foto pode ser trocada a qualquer momento.</p></div>
    <form id="frmF" class="cartao" novalidate>
      ${trav ? '<p class="alerta-pres" role="status">Ficha travada. Para mudar algo, use "Solicitar alteração".</p>' : ''}${fi.pedido && admin ? '<p class="alerta-pres" role="status">O médium pediu alteração desta ficha.</p>' : ''}
      <p><strong>Nome:</strong> ${esc(nome)}</p>
      <label for="f_ini">Nome iniciático</label><input id="f_ini" value="${esc(fi.nome_iniciatico || '')}"${dis}>
      ${admin ? `<label for="f_grau">Grau doutrinário</label><select id="f_grau"><option value="">Não definido</option>${GRAUS.map(g => `<option${fi.grau === g ? ' selected' : ''}>${g}</option>`).join('')}</select>`
        : `<p><strong>Grau doutrinário:</strong> ${esc(fi.grau || 'definido pelo administrador')}</p>`}
      <h2>Entidades militantes</h2>${TIPOS_ENT.map(t => { const l = c.data.filter(x => x.tipo === t); return `<fieldset class="ent"><legend>${t}</legend>${l.length ? l.map(x => `<label class="chk"><input type="checkbox" value="${x.id}"${sel.has(x.id) ? ' checked' : ''}${dis}>${esc(x.nome)}</label>`).join('') : '<span class="suave">Sem opções cadastradas.</span>'}</fieldset>`; }).join('')}
      ${admin ? `<label class="chk"><input type="checkbox" id="f_trav"${fi.travada ? ' checked' : ''}>Ficha travada para o médium</label>` : ''}
      <p class="erro" id="erroF" role="alert"></p>
      <button class="btn"${dis}>Salvar ficha</button> <button class="btn sec" type="button" id="fImp">Imprimir ficha</button>${trav ? ' <button class="btn sec" type="button" id="fPed">Solicitar alteração</button>' : ''}</form></div>
    <div id="fichaImp"><h1>Ficha mediúnica</h1>${fotoImg(fi.foto, 120)}<p><strong>Nome:</strong> ${esc(nome)}</p><p><strong>Nome iniciático:</strong> ${esc(fi.nome_iniciatico || '')}</p><p><strong>Grau doutrinário:</strong> ${esc(fi.grau || '')}</p>
      ${TIPOS_ENT.filter(t => nomes(t).length).map(t => `<p><strong>${t}:</strong> ${nomes(t).map(esc).join(', ')}</p>`).join('')}</div>`;
  const rec = () => montarFicha(box, cad, admin);
  $('#fotoArq').onchange = async ev => {
    const a = ev.target.files[0]; if (!a) return;
    try {
      const foto = await reduzirFoto(a);
      const {error} = admin ? await sb.from('ficha_mediunica').upsert({membro_id: cad, foto, atualizado_em: new Date().toISOString()}, {onConflict: 'membro_id'}) : await sb.rpc('salvar_minha_foto', {p_foto: foto});
      if (error) { aviso(msgErro(error), true); return; }
      aviso('Foto salva.'); rec();
    } catch (e) { aviso(e.message || 'Não foi possível ler a foto.', true); }
  };
  $('#fImp').onclick = () => { document.body.classList.add('imp-ficha'); window.onafterprint = () => { document.body.classList.remove('imp-ficha'); window.onafterprint = null; }; window.print(); };
  if ($('#fPed')) $('#fPed').onclick = async () => {
    const t = window.prompt('O que você precisa alterar na sua ficha?'); if (!t || !t.trim()) return;
    const {error} = await sb.rpc('pedir_alteracao_ficha', {p_texto: t.trim()});
    aviso(error ? msgErro(error) : 'Pedido enviado ao administrador.', !!error);
  };
  $('#frmF').onsubmit = async ev => {
    ev.preventDefault();
    const ids = [...box.querySelectorAll('fieldset.ent input:checked')].map(x => Number(x.value)), ini = $('#f_ini').value.trim();
    const {error} = admin
      ? await sb.from('ficha_mediunica').upsert({membro_id: cad, nome_iniciatico: ini || null, grau: $('#f_grau').value || null, entidades: ids, travada: $('#f_trav').checked, pedido: false, atualizado_em: new Date().toISOString()}, {onConflict: 'membro_id'})
      : await sb.rpc('salvar_minha_ficha', {p_nome: ini, p_entidades: ids});
    if (error) { $('#erroF').textContent = msgErro(error); return; }
    aviso('Ficha salva.'); rec();
  };
}

const EVC = {}, PESSOAIS = ['contribuicao', 'corrente', 'mensagens', 'diario', 'atividades', 'senha', 'meucadastro'];

function textoEvento(x) {
  const d = new Date(x.data_hora), l = [`*${x.titulo}*`, `📅 ${SEM[d.getDay()]}, ${d.toLocaleDateString('pt-BR')} às ${_hm(d)}`];
  if (x.local) l.push(`📍 ${x.local}`);
  if (x.descricao) l.push('', x.descricao);
  l.push('', `🔗 ${location.origin + location.pathname}#/agenda`);
  return l.join('\n');
}
async function copiarEvento(id) {
  const x = EVC[id]; if (!x) return; const t = textoEvento(x);
  try { await navigator.clipboard.writeText(t); aviso('Texto copiado. É só colar no WhatsApp.'); } catch (e) { window.prompt('Copie o texto:', t); }
}
function zapEvento(id) { const x = EVC[id]; if (x) window.open('https://wa.me/?text=' + encodeURIComponent(textoEvento(x)), '_blank', 'noopener'); }

const bloq = () => {
  const r = Promise.resolve({data: null, error: {message: 'Modo "ver como": somente leitura, nada foi salvo.'}});
  const p = new Proxy(r, {get: (t, k) => (k === 'then' || k === 'catch' || k === 'finally') ? t[k].bind(t) : () => p});
  return p;
};
const _sbFrom = sb.from.bind(sb), _sbRpc = sb.rpc.bind(sb);
sb.from = t => { const q = _sbFrom(t); if (verComo) ['insert', 'update', 'upsert', 'delete'].forEach(m => { q[m] = bloq; }); return q; };
sb.rpc = (n, a) => verComo && /^(salvar_|pedir_|admin_)/.test(n) ? bloq() : _sbRpc(n, a);

    if (b.dataset.a === 'ap') { const q = await sb.from(c.tabela).update({aprovada: true}).eq('id', r.id).select(); if (q.error || !q.data || !q.data.length) aviso(q.error ? msgErro(q.error) : 'Não foi possível aprovar.', true); else { aviso('Oração aprovada.'); carregar(); } return; }
    if (b.dataset.a === 'e') { abrir(r); return; }
    if (!(await confirmar(`Excluir "${r.titulo}"? Esta ação não pode ser desfeita.`, 'Excluir'))) return;
    const {data, error} = await sb.from(c.tabela).delete().eq('id', r.id).select();
    if (error || !data || !data.length) { aviso(error ? msgErro(error) : 'Não foi possível excluir.', true); return; }
    aviso('Excluído.'); carregar();
  };
  carregar();
}

const ROTAS = {
  '': viewInicio, 'agenda': viewAgenda, 'entrar': viewEntrar,
  'admin/noticias': () => viewCrud(CFG.noticias),
  'admin/eventos': () => viewCrud(CFG.eventos),
  'admin/membros': viewMembros,
  'admin/financeiro': async () => { await viewCrud(CFG.lancamentos); $('#alertaPres').insertAdjacentHTML('afterend', '<div id="blocoContrib"></div>'); montarContrib($('#blocoContrib')); },
  'admin/estoque': () => viewCrud(CFG.estoque),
  'admin/estoque/historico': viewHistorico,
  'admin/estoque/inventario': viewInventario,
  'admin/relatorios': () => viewRelSemanal(),
  'admin/relatorios/mensal': viewRelMensal,
  'admin/questionarios': viewQuestionarios,
  'admin/questionarios/entregas': viewEntregas,
  'admin/situacao': viewSituacao,
  'admin/mensagens': viewMensagensAdm, 'admin/recepcao': viewRecepcao, 'admin/vercomo': viewVerComo, 'ervas': () => viewTextos('ervas'), 'pontos': () => viewTextos('pontos'), 'senha': viewSenha, 'meucadastro': viewMeuCadastro, 'admin/corrente': () => { location.hash = '#/corrente'; }, 'corrente': viewCorrente, 'admin/contribuicoes': () => { location.hash = '#/admin/financeiro'; }, 'lua': viewLua, 'contribuicao': viewContribuicao, 'mensagens': viewMensagens,
  'atividades': viewAtividades,
  'diario': () => viewTextos('diario'),
  'biblioteca': () => viewTextos('material'),
  'material': () => { location.hash = '#/biblioteca'; },
  'limpeza': viewLimpeza,
  'oracoes': () => viewTextos('oracoes')
};

const grupoNav = x => /^admin\/(estoque|recepcao|corrente)(\/|$)/.test(x) ? x.split('/').slice(0, 2).join('/') : x.startsWith('admin') ? 'admin/noticias' : x;

async function rotear() {
  const h = (location.hash || '#/').replace(/^#\/?/, '');
  nav.classList.remove('aberto'); $('#menuBtn').setAttribute('aria-expanded', 'false');
  const adm = h.startsWith('admin');
  document.querySelectorAll('#nav a').forEach(a => {
    const ah = a.getAttribute('href').replace(/^#\/?/, '');
    a.toggleAttribute('aria-current', grupoNav(ah) === grupoNav(h));
  });
  const mNot = h.match(/^noticia\/(\d+)$/);
  const f = mNot ? () => viewNoticia(Number(mNot[1])) : ROTAS[h];
  document.title = CONFIG.nome;
  if (!f) { location.hash = '#/'; return; }
  if (h === 'entrar' && sessao) { location.hash = '#/'; return; }
  if (verComo && PESSOAIS.includes(h)) { app.innerHTML = '<div class="cartao estreito"><h1>Dados pessoais ocultos</h1><p>No modo "ver como", as telas pessoais não são mostradas.</p></div>'; return; }
  if (adm && !exigirAdmin(h)) return;
  if (perfil && perfil.papel === 'admin') limparEventosEncerrados();
  await f();
  window.scrollTo(0, 0);
}

async function iniciar() {
  document.title = CONFIG.nome;
  $('#marcaTxt').textContent = CONFIG.nome;
  const ic = document.createElement('link'); ic.rel = 'icon'; ic.href = $('#logoTopo').src; document.head.appendChild(ic);
  $('#menuBtn').onclick = () => { const a = nav.classList.toggle('aberto'); $('#menuBtn').setAttribute('aria-expanded', String(a)); };
  window.addEventListener('hashchange', rotear);
  app.addEventListener('change', e => {
    const sl = e.target.closest('select[data-acao=medium]'); if (!sl) return;
    const w = sl.closest('.presenca'), ir = w.querySelector('[data-acao=irei]');
    if (sl.value && ir.getAttribute('aria-pressed') === 'true') salvarPresenca(Number(ir.dataset.id), true, null, w);
  });
  app.addEventListener('click', ev => {
    const b = ev.target.closest('button[data-acao]'); if (!b) return;
    if (b.dataset.acao === 'curtir') alternarCurtida(b);
    else if (b.dataset.acao === 'compartilhar') compartilhar(Number(b.dataset.id), b.dataset.titulo);
    else if (b.dataset.acao === 'desmarcar') salvarPresenca(Number(b.dataset.id), false, 'Desmarcou a presença', b.closest('.presenca'));
    else if (b.dataset.acao === 'copiar-evento') copiarEvento(Number(b.dataset.id));
    else if (b.dataset.acao === 'zap-evento') zapEvento(Number(b.dataset.id));
    else if (b.dataset.acao === 'irei') salvarPresenca(Number(b.dataset.id), true, null, b.closest('.presenca'));
    else if (b.dataset.acao === 'naoirei') { const w = b.closest('.presenca'); w.querySelector('.pr-motivo').hidden = false; w.querySelector('input').focus(); }
    else if (b.dataset.acao === 'salvar-motivo') {
      const w = b.closest('.presenca'), m = w.querySelector('input').value.trim();
      if (!m) { aviso('Informe o motivo de não ir.', true); return; }
      salvarPresenca(Number(b.dataset.id), false, m, w);
    }
  });
  try {
    const {data} = await sb.auth.getSession();
    sessao = data.session;
    await carregarPerfil();
  } catch (e) { sessao = null; perfil = null; }
  desenharNav();
  await rotear();
  window.__ok = true;
  atualizarAvisos(); setInterval(atualizarAvisos, 120000);
  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === 'INITIAL_SESSION' || ev === 'TOKEN_REFRESHED') { if (s) sessao = s; return; }
    const mesmo = (s && s.user && sessao && sessao.user && s.user.id === sessao.user.id);
    sessao = s;
    if (mesmo) return;
    setTimeout(async () => { await carregarPerfil(); desenharNav(); rotear(); atualizarAvisos(); }, 0);
  });
}
marcarDatas();
iniciar();
</script>
